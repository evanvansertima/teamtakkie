services:
  app:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # .env has HOST=localhost for `npm run dev`; inside the container
      # that binds to loopback only, which Caddy can't reach. Must be
      # 0.0.0.0 for other containers to see it on the compose network.
      HOST: 0.0.0.0
      APP_URL: http://app:3333
    volumes:
      - backend_data:/app/tmp

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  backend_data:
  caddy_data:
  caddy_config:
