function StaafGrafiek({ reeksen, labels, kleuren, hoogte }) {
  const H = hoogte || 150;
  const B = 320;
  const marge = {boven:10, onder:22, links:26, rechts:6};
  const grafiekB = B - marge.links - marge.rechts;
  const grafiekH = H - marge.boven - marge.onder;
  const aantal = labels.length;
  if (aantal===0) return null;
  const maxWaarde = Math.max(1, Math.max.apply(null, reeksen.map(function(r){
    return Math.max.apply(null, r.concat([0]));
  })));
  const groepB = grafiekB / aantal;
  const staafB = Math.max(3, (groepB*0.68) / reeksen.length);
  const ticks = [0, Math.ceil(maxWaarde/2), maxWaarde].filter(function(v,i,a){return a.indexOf(v)===i;});
  return (
    <svg viewBox={"0 0 "+B+" "+H} style={{width:"100%",height:"auto",display:"block"}}>
      {ticks.map(function(t){
        const y = marge.boven + grafiekH - (t/maxWaarde)*grafiekH;
        return (
          <g key={t}>
            <line x1={marge.links} y1={y} x2={B-marge.rechts} y2={y} stroke="#e2e6ea" strokeWidth="1"/>
            <text x={marge.links-5} y={y+3} textAnchor="end" fontSize="8" fill="#6c757d" fontFamily="Helvetica Neue,Arial">{t}</text>
          </g>
        );
      })}
      {labels.map(function(lab,i){
        return reeksen.map(function(reeks,r){
          const waarde = reeks[i]||0;
          const h = (waarde/maxWaarde)*grafiekH;
          const x = marge.links + i*groepB + (groepB - staafB*reeksen.length)/2 + r*staafB;
          return <rect key={i+"-"+r} x={x} y={marge.boven+grafiekH-h} width={staafB-1} height={Math.max(h,waarde>0?1.5:0)} fill={kleuren[r]} rx="1.5"/>;
        });
      })}
      {labels.map(function(lab,i){
        if (aantal>12 && i%2===1) return null;
        return <text key={"l"+i} x={marge.links+i*groepB+groepB/2} y={H-7} textAnchor="middle" fontSize="8" fill="#6c757d" fontFamily="Helvetica Neue,Arial">{lab}</text>;
      })}
      <line x1={marge.links} y1={marge.boven+grafiekH} x2={B-marge.rechts} y2={marge.boven+grafiekH} stroke="#adb5bd" strokeWidth="1"/>
    </svg>
  );
}

function LijnGrafiek({ waarden, labels, kleur, hoogte, eenheid }) {
  const H = hoogte || 140;
  const B = 320;
  const marge = {boven:10, onder:22, links:28, rechts:8};
  const grafiekB = B - marge.links - marge.rechts;
  const grafiekH = H - marge.boven - marge.onder;
  if (!waarden || waarden.length===0) return null;
  const maxWaarde = Math.max(1, Math.max.apply(null, waarden));
  const stap = waarden.length>1 ? grafiekB/(waarden.length-1) : 0;
  const punten = waarden.map(function(v,i){
    return {x: marge.links + i*stap, y: marge.boven + grafiekH - (v/maxWaarde)*grafiekH};
  });
  const pad = punten.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1); }).join(" ");
  const vulPad = pad+" L"+punten[punten.length-1].x.toFixed(1)+" "+(marge.boven+grafiekH)+" L"+punten[0].x.toFixed(1)+" "+(marge.boven+grafiekH)+" Z";
  const ticks = [0, Math.round(maxWaarde/2), maxWaarde].filter(function(v,i,a){return a.indexOf(v)===i;});
  return (
    <svg viewBox={"0 0 "+B+" "+H} style={{width:"100%",height:"auto",display:"block"}}>
      {ticks.map(function(t){
        const y = marge.boven + grafiekH - (t/maxWaarde)*grafiekH;
        return (
          <g key={t}>
            <line x1={marge.links} y1={y} x2={B-marge.rechts} y2={y} stroke="#e2e6ea" strokeWidth="1"/>
            <text x={marge.links-5} y={y+3} textAnchor="end" fontSize="8" fill="#6c757d" fontFamily="Helvetica Neue,Arial">{t+(eenheid||"")}</text>
          </g>
        );
      })}
      {punten.length>1 && <path d={vulPad} fill={kleur} opacity="0.13"/>}
      {punten.length>1 && <path d={pad} fill="none" stroke={kleur} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>}
      {punten.map(function(p,i){ return <circle key={i} cx={p.x} cy={p.y} r="3" fill="#fff" stroke={kleur} strokeWidth="2"/>; })}
      {labels.map(function(lab,i){
        if (labels.length>10 && i%2===1) return null;
        return <text key={"l"+i} x={punten[i].x} y={H-7} textAnchor="middle" fontSize="8" fill="#6c757d" fontFamily="Helvetica Neue,Arial">{lab}</text>;
      })}
    </svg>
  );
}

function RadarGrafiek({ waarden, normen, labels, hoogte }) {
  const H = hoogte || 230;
  const B = 300;
  const cx = B/2, cy = H/2 + 4;
  const R = Math.min(B, H)/2 - 34;
  const n = labels.length;
  if (n < 3) return null;

  function punt(i, w) {
    const hoek = -Math.PI/2 + i*2*Math.PI/n;
    const r = R * Math.max(0, Math.min(10, w)) / 10;
    return [cx + Math.cos(hoek)*r, cy + Math.sin(hoek)*r];
  }
  function pad(reeks) {
    return reeks.map(function(w,i){
      const p = punt(i, w===null||w===undefined ? 0 : w);
      return (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1);
    }).join(" ") + " Z";
  }

  return (
    <svg viewBox={"0 0 "+B+" "+H} style={{width:"100%",height:"auto",display:"block"}}>
      {[2,4,6,8,10].map(function(ring){
        const d = labels.map(function(_,i){
          const p = punt(i, ring);
          return (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1);
        }).join(" ") + " Z";
        return <path key={ring} d={d} fill="none" stroke="var(--grijs)" strokeWidth="1"/>;
      })}
      {labels.map(function(_,i){
        const p = punt(i, 10);
        return <line key={"as"+i} x1={cx} y1={cy} x2={p[0]} y2={p[1]} stroke="var(--grijs)" strokeWidth="1"/>;
      })}
      {normen && <path d={pad(normen)} fill="none" stroke="var(--grijs-donker)" strokeWidth="1.6" strokeDasharray="4 3"/>}
      <path d={pad(waarden)} fill="var(--blauw)" fillOpacity="0.22" stroke="var(--blauw)" strokeWidth="2.2" strokeLinejoin="round"/>
      {waarden.map(function(w,i){
        if (w===null||w===undefined) return null;
        const p = punt(i, w);
        return <circle key={"p"+i} cx={p[0]} cy={p[1]} r="3.2" fill="var(--wit)" stroke="var(--blauw)" strokeWidth="2"/>;
      })}
      {labels.map(function(lab,i){
        const p = punt(i, 12.1);
        const uitlijn = Math.abs(p[0]-cx) < 6 ? "middle" : (p[0] > cx ? "start" : "end");
        return (
          <text key={"l"+i} x={p[0]} y={p[1]+3} textAnchor={uitlijn}
            fontSize="10" fontWeight="700" fill="var(--grijs-donker)"
            fontFamily="Helvetica Neue,Arial">{lab}</text>
        );
      })}
    </svg>
  );
}

function GrafiekLegenda({ items }) {
  return (
    <div className="grafiek-legenda">
      {items.map(function(it){
        return (
          <div key={it.label} className="grafiek-legenda-item">
            <span className="grafiek-legenda-blok" style={{background:it.kleur}}/>
            <span>{it.label}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   INSTELLINGEN & BACK-UP
═══════════════════════════════════════════════════════════ */
function InstellingenSheet({ onSluiten }) {
  const i = gebruikInstellingen();
  const [melding, setMelding] = useState(null);
  const [fout, setFout] = useState(null);
  const [bevestigImport, setBevestigImport] = useState(null);
  const bestandRef = useRef(null);
  const logoRef = useRef(null);

  function kiesLogo(e) {
    var bestand = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!bestand) return;
    verwerkLogoBestand(bestand, function(err, dataUrl){
      if (err) { meldFout(err); return; }
      zetInstellingen({logo: dataUrl});
      meldGoed("Logo ingesteld");
    });
  }

  const aantalSpelers = laadSpelers().length;
  const aantalWedstrijden = laadWedstrijden().length;
  const aantalTrainingen = laadTrainingen().length;

  function exporteer() {
    exporteerAlleData();
    setFout(null);
    setMelding("Back-up gedownload. Bewaar dit bestand op een veilige plek.");
    setTimeout(function(){setMelding(null);},5000);
  }

  function kiesBestand(e) {
    var bestand = e.target.files && e.target.files[0];
    if (bestand) setBevestigImport(bestand);
    e.target.value = "";
  }

  function voerImportUit() {
    var bestand = bevestigImport;
    setBevestigImport(null);
    importeerAlleData(bestand, function(err, aantal){
      if (err) { setMelding(null); setFout(err); return; }
      setFout(null);
      setMelding(aantal+" items hersteld. De app wordt opnieuw geladen…");
      setTimeout(function(){ window.location.reload(); },1400);
    });
  }

  return (
    <div className="formatie-overlay" onClick={function(e){ if(e.target===e.currentTarget) onSluiten(); }}>
      <div className="formatie-sheet" onClick={function(e){e.stopPropagation();}}>
        <div className="formatie-sheet-header">
          <span className="formatie-sheet-titel">Instellingen</span>
          <button style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"var(--grijs-donker)",padding:"0 4px"}}
            onClick={onSluiten}>{"✕"}</button>
        </div>

        <div className="kaart" style={{marginTop:4}}>
          <div className="kaart-titel"><i className="fa-solid fa-image"/> Clublogo</div>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <div style={{width:66,height:66,borderRadius:16,background:"var(--grijs-licht)",border:"1px solid var(--grijs)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
              <img src={logoKopbalk()} alt="logo" style={{width:"100%",height:"100%",objectFit:"contain",padding:4}}/>
            </div>
            <div style={{flex:1}}>
              <button className="knop lijn klein" style={{width:"100%",justifyContent:"center",marginBottom:6}}
                onClick={function(){ if(logoRef.current) logoRef.current.click(); }}>
                <i className="fa-solid fa-upload"/>{i.logo?" Logo vervangen":" Logo kiezen"}
              </button>
              {i.logo && (
                <button className="knop lijn klein" style={{width:"100%",justifyContent:"center"}}
                  onClick={function(){ zetInstellingen({logo:null}); meldGoed("Terug naar het FC Harlingen-logo"); }}>
                  <i className="fa-solid fa-rotate-left"/> Terug naar clublogo
                </button>
              )}
            </div>
          </div>
          <input ref={logoRef} type="file" accept="image/*" style={{display:"none"}} onChange={kiesLogo} />
          <p style={{fontSize:12,color:"var(--grijs-donker)",fontWeight:400,lineHeight:1.5,marginTop:10}}>
            Het FC Harlingen-wapen zit ingebouwd. Kies een eigen afbeelding als je de app voor een ander team gebruikt. Verschijnt bovenaan, op je gedeelde opstelling en in de PDF's.
          </p>
        </div>

        <div className="kaart">
          <div className="kaart-titel"><i className="fa-solid fa-shield-halved"/> Team</div>
          <div className="formulier-rij">
            <div className="formulier-groep">
              <label className="formulier-label">Club</label>
              <input className="formulier-input" value={i.clubNaam}
                onChange={function(e){zetInstellingen({clubNaam:e.target.value});}} placeholder="FC Harlingen" />
            </div>
            <div className="formulier-groep">
              <label className="formulier-label">Team</label>
              <input className="formulier-input" value={i.teamNaam}
                onChange={function(e){zetInstellingen({teamNaam:e.target.value});}} placeholder="JO19-2" />
            </div>
          </div>
          <div className="formulier-rij">
            <div className="formulier-groep">
              <label className="formulier-label">Seizoen</label>
              <input className="formulier-input" value={i.seizoen}
                onChange={function(e){zetInstellingen({seizoen:e.target.value});}} placeholder="2025/2026" />
            </div>
            <div className="formulier-groep">
              <label className="formulier-label">Speelduur (min)</label>
              <input className="formulier-input" type="number" min="20" max="120" value={i.speelduur}
                onChange={function(e){zetInstellingen({speelduur:Number(e.target.value)||90});}} />
            </div>
          </div>
          <div className="formulier-groep">
            <label className="formulier-label">Vaste thuislocatie</label>
            <input className="formulier-input" value={i.locatie}
              onChange={function(e){zetInstellingen({locatie:e.target.value});}} placeholder="Sportpark De Zeehoek" />
          </div>
        </div>

        <div className="kaart">
          <div className="kaart-titel"><i className="fa-solid fa-circle-half-stroke"/> Weergave</div>
          <div className="thema-rij">
            {[{id:"licht",label:"Licht",ic:"fa-solid fa-sun"},
              {id:"donker",label:"Donker",ic:"fa-solid fa-moon"},
              {id:"systeem",label:"Systeem",ic:"fa-solid fa-circle-half-stroke"}].map(function(t){
              var aan = (i.thema||"systeem")===t.id;
              return (
                <button key={t.id} className="thema-optie"
                  style={{borderColor:aan?"var(--blauw)":"var(--grijs)",background:aan?"var(--blauw)":"var(--wit)",color:aan?"#fff":"var(--grijs-donker)"}}
                  onClick={function(){zetInstellingen({thema:t.id});}}>
                  <i className={t.ic} style={{fontSize:15}}/>
                  <span>{t.label}</span>
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12,color:"var(--grijs-donker)",fontWeight:400,lineHeight:1.5,marginTop:9}}>
            Systeem volgt de instelling van je telefoon. Donker is prettiger bij avondwedstrijden.
          </p>

          <div className="kaart-titel" style={{marginTop:16}}><i className="fa-solid fa-palette"/> Accentkleur</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ACCENTEN.map(function(a){
              var aan = (i.accent||"club")===a.id;
              return (
                <button key={a.id} title={a.label}
                  style={{flex:"1 1 60px",minWidth:60,border:"2px solid",borderRadius:12,padding:"9px 6px",
                          cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6,
                          borderColor:aan?a.l[0]:"var(--grijs)",background:aan?"var(--grijs-licht)":"var(--wit)",
                          fontFamily:"'Helvetica Neue',Arial,sans-serif",fontSize:10,fontWeight:700,
                          color:aan?a.l[0]:"var(--grijs-donker)"}}
                  onClick={function(){ zetInstellingen({accent:a.id}); }}>
                  <span style={{width:26,height:26,borderRadius:"50%",
                                background:"linear-gradient(135deg,"+a.l[0]+","+a.l[1]+")",
                                border:aan?"2px solid var(--wit)":"none",
                                boxShadow:aan?"0 0 0 2px "+a.l[0]:"none"}}/>
                  <span>{a.label}</span>
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12,color:"var(--grijs-donker)",fontWeight:400,lineHeight:1.5,marginTop:9}}>
            De accentkleur kleurt knoppen, tabbladen en grafieken. Het clublogo en de tenuekleuren blijven ongemoeid.
          </p>
        </div>

        <div className="kaart">
          <div className="kaart-titel"><i className="fa-solid fa-database"/> Jouw gegevens</div>
          <div className="stat-raster-3">
            <div className="stat-pill"><div className="stat-pill-getal">{aantalSpelers}</div><div className="stat-pill-label">Spelers</div></div>
            <div className="stat-pill"><div className="stat-pill-getal">{aantalWedstrijden}</div><div className="stat-pill-label">Wedstrijden</div></div>
            <div className="stat-pill"><div className="stat-pill-getal">{aantalTrainingen}</div><div className="stat-pill-label">Trainingen</div></div>
          </div>
          <p style={{fontSize:12,color:"var(--grijs-donker)",fontWeight:400,lineHeight:1.5,marginTop:4}}>
            Alles staat alleen in deze browser. Wis je de browsergegevens, dan is het weg. Maak daarom regelmatig een back-up.
          </p>
        </div>

        <div className="kaart">
          <div className="kaart-titel"><i className="fa-solid fa-shield-halved"/> Back-up</div>
          <button className="knop" style={{width:"100%",justifyContent:"center",marginBottom:8}} onClick={exporteer}>
            <i className="fa-solid fa-download"/> Back-up downloaden
          </button>
          <button className="knop lijn" style={{width:"100%",justifyContent:"center"}}
            onClick={function(){ if(bestandRef.current) bestandRef.current.click(); }}>
            <i className="fa-solid fa-upload"/> Back-up terugzetten
          </button>
          <input ref={bestandRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={kiesBestand} />
        </div>

        {melding && (
          <div className="kaart" style={{background:"var(--vlak-succes)",borderLeft:"4px solid var(--succes)",color:"var(--op-succesvlak)"}}>
            <div style={{fontSize:13,fontWeight:600,lineHeight:1.5}}>
              <i className="fa-solid fa-circle-check"/>{" "+melding}
            </div>
          </div>
        )}
        {fout && (
          <div className="kaart" style={{background:"var(--vlak-gevaar)",borderLeft:"4px solid var(--gevaar)",color:"var(--op-gevaarvlak)"}}>
            <div style={{fontSize:13,fontWeight:600,lineHeight:1.5}}>
              <i className="fa-solid fa-triangle-exclamation"/>{" "+fout}
            </div>
          </div>
        )}

        <div className="kaart">
          <div className="kaart-titel"><i className="fa-solid fa-mobile-screen"/> Op je beginscherm</div>
          <p style={{fontSize:13,color:"var(--grijs-donker)",fontWeight:400,lineHeight:1.6}}>
            <strong style={{color:"var(--tekst)"}}>iPhone:</strong> deelknop → Zet op beginscherm.<br/>
            <strong style={{color:"var(--tekst)"}}>Android:</strong> menu → App installeren.<br/>
            Werkt alleen als de app via een webadres geopend wordt, niet vanaf een los bestand.
          </p>
        </div>

        <div className="kaart over-kaart">
          <div className="over-logo"><Logo /></div>
          <div className="over-titel">{teamNaamVol()}</div>
          <div className="over-sub">Teammanager</div>
          <div className="over-lijn"/>
          <div className="over-studio">{ONTWERPER.studio}</div>
          <div className="over-naam">Ontwerp en bouw · {ONTWERPER.naam}</div>
        </div>

        {bevestigImport && (
          <div className="bevestig-overlay" onClick={function(e){if(e.target===e.currentTarget)setBevestigImport(null);}}>
            <div className="bevestig-kaart">
              <h3>Back-up terugzetten?</h3>
              <p>Alle huidige spelers, wedstrijden, trainingen en tactieken worden vervangen door de inhoud van het back-upbestand. Dit kan niet ongedaan gemaakt worden.</p>
              <div className="bevestig-knoppen">
                <button className="knop lijn" onClick={function(){setBevestigImport(null);}}>Annuleren</button>
                <button className="knop gevaar" onClick={voerImportUit}>Terugzetten</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════ */
/* Onderbalk op de telefoon: vijf knoppen, meer past er niet */
const navItems = [{id:"dashboard",label:"Home",icoon:"fa-solid fa-house"},{id:"wedstrijden",label:"Wedstrijden",icoon:"fa-solid fa-futbol"},{id:"selectie",label:"Selectie",icoon:"fa-solid fa-users"},{id:"trainingen",label:"Training",icoon:"fa-solid fa-person-running"},{id:"statistieken",label:"Stats",icoon:"fa-solid fa-chart-bar"}];

/* Zijmenu op tablet en laptop: daar is ruimte voor alles */
const zijGroepen = [
  {kop:null, items:[
    {id:"dashboard",    label:"Dashboard",    icoon:"fa-solid fa-house"},
    {id:"wedstrijden",  label:"Wedstrijden",  icoon:"fa-solid fa-futbol"},
    {id:"trainingen",   label:"Trainingen",   icoon:"fa-solid fa-person-running"},
    {id:"selectie",     label:"Selectie",     icoon:"fa-solid fa-users"},
    {id:"agenda",       label:"Agenda",       icoon:"fa-solid fa-calendar-days"}
  ]},
  {kop:"Analyse", items:[
    {id:"statistieken", label:"Statistieken", icoon:"fa-solid fa-chart-bar"},
    {id:"live",         label:"Live analyse", icoon:"fa-solid fa-stopwatch"}
  ]}
];

function App() {
  const [pagina,setPagina]=useState("dashboard");
  const [instellingenOpen,setInstellingenOpen]=useState(false);
  const i = gebruikInstellingen();

  useEffect(function(){
    pasThemaToe(i.thema);
    if (i.thema!=="systeem" || !window.matchMedia) return;
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function volg(){ pasThemaToe("systeem"); }
    if (mq.addEventListener) mq.addEventListener("change", volg);
    else if (mq.addListener) mq.addListener(volg);
    return function(){
      if (mq.removeEventListener) mq.removeEventListener("change", volg);
      else if (mq.removeListener) mq.removeListener(volg);
    };
  },[i.thema, i.accent]);
  function renderPagina() {
    switch(pagina) {
      case "dashboard":    return <Dashboard navigeer={setPagina} />;
      case "selectie":     return <SelectiePagina />;
      case "wedstrijden":  return <WedstrijdenModule />;
      case "trainingen":   return <TrainingenModule />;
      case "agenda":       return <AgendaModule navigeer={setPagina} />;
      case "statistieken": return <StatistiekenModule />;
      case "live":         return <StatistiekenModule defaultTab="live" />;
      default: return null;
    }
  }
  return (
    <div className="app-schil">
      <aside className="zijbalk">
        <div className="zijbalk-merk">
          <Logo />
          <div className="header-tekst">
            <h1>{i.clubNaam||"Team"}</h1>
            <div className="header-subtitel">{i.teamNaam||"Team Manager"}</div>
          </div>
        </div>
        <nav className="zijbalk-nav">
          {zijGroepen.map(function(groep,gi){
            return (
              <React.Fragment key={"g"+gi}>
                {groep.kop && <div className="zijbalk-kop">{groep.kop}</div>}
                {groep.items.map(function(item){
                  return (
                    <button key={item.id}
                      className={"zij-item"+(pagina===item.id?" actief":"")}
                      aria-current={pagina===item.id?"page":undefined}
                      onClick={function(){ setPagina(item.id); }}>
                      <span className="zij-icoon"><i className={item.icoon}/></span>
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </React.Fragment>
            );
          })}
        </nav>
        <div className="zijbalk-voet">
          <button className="zij-item" onClick={function(){setInstellingenOpen(true);}}>
            <span className="zij-icoon"><i className="fa-solid fa-gear"/></span>
            <span>Instellingen</span>
          </button>
          <div className="zij-ontwerp">
            <span className="zij-ontwerp-studio">{ONTWERPER.studio}</span>
            <span className="zij-ontwerp-naam">{ONTWERPER.naam}</span>
          </div>
        </div>
      </aside>

      <header className="header">
        <div className="header-logo"><Logo /><div className="header-tekst"><h1>{i.clubNaam||"Team"}</h1><div className="header-subtitel">{(i.teamNaam?i.teamNaam+" · ":"")+"Team Manager"}</div></div></div>
        <button aria-label="Instellingen"
          style={{fontSize:20,cursor:"pointer",background:"none",border:"none",color:"inherit",padding:"6px 4px"}}
          onClick={function(){setInstellingenOpen(true);}}>
          <i className="fa-solid fa-gear"/>
        </button>
      </header>
      <main key={pagina} className="inhoud">{renderPagina()}</main>
      {instellingenOpen && <InstellingenSheet onSluiten={function(){setInstellingenOpen(false);}} />}
      <ToastHouder />
      <nav className="bottom-nav">
        {navItems.map(item=>(
          <button key={item.id} className={`nav-item ${pagina===item.id?"actief":""}`} onClick={()=>setPagina(item.id)}>
            <div className="nav-pip"/><span className="nav-icon"><i className={item.icoon}/></span><span>{item.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
