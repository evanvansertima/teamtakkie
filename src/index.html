      .park-doek:not(.vol) .park-meer.aan {
        background:var(--blauw); border-color:var(--blauw); color:#fff; }
      /* De balk boven het gekozen onderdeel telt zeven knoppen en twee
         getallen. Met vingermaten is dat ruim vierhonderd punten breed,
         gecentreerd op iets wat overal kan staan — op een telefoon hangt
         hij dus half buiten beeld en ligt hij over je hele bouwvlak.
         Alles wat erin zat staat nu in het paneel eronder. De gele en
         blauwe sleepblokjes blijven wel: die horen bij het onderdeel. */
      .park-doek:not(.vol) .park-greep { display:none; }
    }
    /* Handvatten op maat van een vingertop. Een muispunt is een punt,
       een vingertop dekt er ongeveer vierenveertig. Dit gaat via
       (pointer: coarse) en niet via de breedte van het scherm, zodat
       een tablet met een muis de kleine grepen houdt. */
    @media (pointer: coarse) {
      /* Schermvullend blijven de knoppen zweven, want daar is het doek
         het hele venster. Maar zonder muisaanwijzer ziet niemand ooit
         een tooltip, dus krijgen ze daar hetzelfde woord als in de balk
         eronder. Anders staar je naar zestien icoontjes zonder uitleg. */
      .park-doek.vol .park-werkknop,
      .park-doek.vol .park-stuurknop {
        width:auto; min-width:54px; height:50px; flex-direction:column;
        gap:2px; padding:0 7px; }
      .park-doek.vol .park-knopnaam { display:block; font-size:8.5px; font-weight:800;
        letter-spacing:.2px; text-transform:uppercase; line-height:1; }
      .park-doek.vol .park-werk,
      .park-doek.vol .park-stuur { flex-direction:row; flex-wrap:wrap; max-width:184px; }
      .park-doek.vol .park-stuur { justify-content:flex-end; }
      .park-doek.vol .park-stuur-scheiding { width:1px; height:38px; margin:0 2px;
        align-self:center; }
      .park-greepknop { width:42px; height:42px; font-size:15px; }
      .park-greep { gap:4px; padding:4px; }
      .park-greepdeel { height:28px; }
      .park-maatgreep, .park-hooggreep { width:40px; height:40px; font-size:15px; }
      .park-dagknop { padding:9px 11px; }
      .park-werkknop, .park-stuurknop { width:44px; height:44px; }
      .park-slot-knop { padding:9px 10px; }
    }

    /* ── TEGENSTANDER ── */
    .teg-speler { display:flex; align-items:flex-start; gap:8px; padding:9px 0;
      border-bottom:1px solid var(--grijs-licht); }
    .teg-speler:last-child { border-bottom:none; }
    .teg-nummer { width:52px; flex-shrink:0; text-align:center; margin:0; padding:6px 4px;
      font-size:14px; font-weight:800; }
    .teg-eerder { display:flex; align-items:center; gap:10px; padding:9px 0;
      border-bottom:1px solid var(--grijs-licht); }
    .teg-eerder:last-child { border-bottom:none; }
    .teg-uitslag { min-width:56px; text-align:center; border-radius:8px; padding:5px 8px;
      font-size:13px; font-weight:800; font-family:'Helvetica Neue',Arial,sans-serif;
      background:var(--grijs-licht); color:var(--grijs-donker); flex-shrink:0; }
    .teg-uitslag.winst   { background:#dcfce7; color:#166534; }
    .teg-uitslag.verlies { background:#fee2e2; color:#991b1b; }
    .teg-uitslag.gelijk  { background:#fef3c7; color:#8a5200; }

    /* ── BOETEPOT ── */
    .boete-seizoen { border:2px dashed var(--grijs); border-radius:11px; padding:11px 12px;
      margin-top:12px; display:flex; align-items:center; }
    .boete-seizoen.aan { border-style:solid; border-color:var(--succes); background:var(--vlak-info); }
    .boete-seizoen-sub { display:block; font-size:11px; color:var(--grijs-donker);
      font-weight:400; line-height:1.5; margin-top:2px; }
    .boete-totalen { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    .boete-vak { border:2px solid var(--grijs); border-radius:11px; padding:10px 8px; text-align:center; }
    .boete-vak.betaald { border-color:var(--succes); }
    .boete-vak.open    { border-color:var(--gevaar); }
    .boete-getal { font-size:17px; font-weight:800; font-family:'Helvetica Neue',Arial,sans-serif;
      white-space:nowrap; }
    .boete-vak.betaald .boete-getal { color:var(--succes); }
    .boete-vak.open .boete-getal    { color:var(--gevaar); }
    .boete-label { font-size:10.5px; color:var(--grijs-donker); font-weight:700;
      text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
    .boete-rij, .boete-regel, .boete-tarief { display:flex; align-items:center; gap:10px;
      padding:9px 0; border-bottom:1px solid var(--grijs-licht); }
    .boete-rij:last-child, .boete-regel:last-child, .boete-tarief:last-child { border-bottom:none; }
    .boete-plek { width:20px; text-align:center; font-size:12px; font-weight:800;
      color:var(--grijs-donker); flex-shrink:0; }
    .boete-naam { font-size:13.5px; font-weight:800; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .boete-sub { font-size:11px; color:var(--grijs-donker); font-weight:400; margin-top:1px; }
    .boete-bedrag { font-size:14px; font-weight:800; text-align:right; white-space:nowrap;
      font-family:'Helvetica Neue',Arial,sans-serif; flex-shrink:0; }
    .boete-bedrag-sub { display:block; font-size:9.5px; font-weight:700; color:var(--grijs-donker);
      text-transform:uppercase; letter-spacing:.4px; }
    .boete-reden { width:26px; height:26px; border-radius:8px; color:#fff; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:12px; }
    .boete-invoer { width:80px; flex-shrink:0; text-align:right; padding:7px 9px; margin:0; }

    /* ── GASTSPELERS ── */
    .gast-rij { display:flex; align-items:center; gap:10px; padding:8px 10px;
      border-radius:10px; background:var(--grijs-licht); margin-bottom:6px; }
    .gast-naam { font-size:13px; font-weight:800; display:flex; align-items:center; gap:7px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .gast-merk { background:#7c3aed; color:#fff; border-radius:99px; padding:1px 7px;
      font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; }
    .gast-sub { font-size:11px; color:var(--grijs-donker); font-weight:400; margin-top:1px; }
    .sc-gast { position:absolute; top:-3px; left:-3px; background:#7c3aed; color:#fff;
      width:15px; height:15px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:8.5px; font-weight:800; border:1.5px solid var(--wit); }

    /* ── DODE SPELMOMENTEN ── */
    .dsm-tabs { flex-wrap:wrap; }
    .dsm-vink { font-size:9px; color:var(--succes); margin-left:5px; }
    .dsm-kop { display:flex; align-items:flex-start; justify-content:space-between;
      gap:10px; flex-wrap:wrap; margin:12px 0 9px; }
    .dsm-titel { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:800; }
    .dsm-uitleg { font-size:11.5px; color:var(--grijs-donker); font-weight:400; margin-top:2px; }
    .dsm-kop-knoppen { display:flex; gap:6px; flex-shrink:0; }
    .dsm-nemers { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
      background:var(--vlak-info); border-radius:9px; padding:7px 10px; margin-bottom:9px;
      font-size:11.5px; color:var(--grijs-donker); font-weight:400; }
    .dsm-nemer { color:#fff; border-radius:99px; padding:2px 9px; font-size:10.5px; font-weight:700; }
    .dsm-gereedschap { display:flex; flex-wrap:wrap; gap:5px; align-items:center;
      max-width:560px; margin:0 auto 8px; }
    .dsm-tool { display:inline-flex; align-items:center; gap:5px; border:2px solid var(--grijs);
      background:var(--wit); color:var(--tekst); border-radius:9px; padding:6px 9px;
      font-size:11px; font-weight:700; cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif;
      -webkit-tap-highlight-color:transparent; }
    .dsm-tool i { font-size:11px; }
    .dsm-tool.actief { border-color:var(--blauw); background:var(--blauw); color:var(--op-kleur); }
    .dsm-tool-scheiding { width:1px; height:20px; background:var(--grijs); margin:0 3px; }
    .dsm-svg.tekenstand { cursor:crosshair; }
    .dsm-lijn { cursor:pointer; }
    .dsm-lijnrij { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      max-width:560px; margin:9px auto 0; }
    .dsm-lijnrij-kop { font-size:11px; font-weight:800; color:var(--grijs-donker); }
    .dsm-lijntel { display:inline-flex; align-items:center; gap:4px; font-size:11px;
      font-weight:700; color:var(--grijs-donker); background:var(--grijs-licht);
      border-radius:99px; padding:2px 8px; }
    .dsm-veld { width:100%; max-width:560px; margin:0 auto; border-radius:12px;
      overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.22); }
    .dsm-svg { width:100%; height:auto; display:block; }
    .dsm-stuk { cursor:grab; }
    .dsm-stuk:active { cursor:grabbing; }
    .dsm-toevoegrij { display:flex; gap:6px; margin:10px auto 0; max-width:560px; }
    .dsm-bol { width:11px; height:11px; border-radius:50%; border:1.5px solid transparent;
      display:inline-block; flex-shrink:0; }
    .dsm-aantal { background:var(--grijs-licht); color:var(--grijs-donker); border-radius:99px;
      padding:0 6px; font-size:10px; font-weight:800; }
    .dsm-hint { font-size:11px; color:var(--grijs-donker); font-weight:400;
      text-align:center; margin:8px 0 0; }
    .dsm-bewerk { margin-top:12px; border:2px solid var(--blauw-licht); }
    @media (max-width:520px) {
      .dsm-toevoegrij { flex-wrap:wrap; }
      .dsm-toevoegrij .knop { min-width:calc(50% - 3px); }
    }

    /* ── BLESSURES & AFWEZIGHEID ── */
    .modal-knoppen { display:flex; gap:8px; margin-top:14px; }
    .modal-knoppen .knop { flex:1; justify-content:center; }
    .afw-teller { display:flex; align-items:center; gap:8px; margin-top:10px; padding:8px 11px;
      border-radius:9px; background:var(--vlak-info); font-size:12px; font-weight:700; color:var(--gevaar); }
    .afw-groepkop { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800;
      text-transform:uppercase; letter-spacing:.7px; margin:0 2px 7px; }
    .afw-groepaantal { background:var(--grijs-licht); color:var(--grijs-donker); border-radius:99px;
      padding:1px 7px; font-size:10px; letter-spacing:0; }
    .afw-kaart { border-left:4px solid var(--grijs); margin-bottom:8px; }
    .afw-kaart.verlopen { opacity:.62; }
    .afw-kop { display:flex; align-items:center; gap:10px; }
    .afw-naam { font-size:14px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .afw-datums { font-size:11.5px; color:var(--grijs-donker); font-weight:400; margin-top:1px; }
    .afw-acties { display:flex; gap:6px; flex-shrink:0; }
    .afw-reden { font-size:12.5px; color:var(--tekst); font-weight:400; line-height:1.5;
      margin:9px 0 0; padding-left:44px; }
    .afw-chips { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 0; padding-left:44px; }
    .afw-chip { display:inline-flex; align-items:center; gap:5px; border-radius:99px;
      padding:3px 9px; font-size:10.5px; font-weight:700; background:var(--grijs-licht); color:var(--grijs-donker); }
    .afw-chip.mee    { background:var(--vlak-waarschuwing,#fef3c7); color:#8a5200; }
    .afw-chip.buiten { background:#dcfce7; color:#166534; }
    .afw-chip.terug  { background:var(--grijs-licht); color:var(--grijs-donker); }
    .afw-hint { border:2px dashed var(--oranje); border-radius:11px; padding:11px 12px; margin-bottom:10px; }
    .afw-hint-kop { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
      color:var(--oranje); margin-bottom:8px; }
    .afw-hint-namen { display:flex; flex-wrap:wrap; gap:6px; }
    .afw-telt { border:2px solid var(--grijs); border-radius:11px; padding:11px 12px; margin-bottom:4px; }
    .afw-telt-uitleg { font-size:11.5px; color:var(--grijs-donker); font-weight:400;
      line-height:1.55; margin:7px 0 0; }
    @media (max-width:520px) {
      .afw-reden, .afw-chips { padding-left:0; }
    }

    .bevestig-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; }
    .bevestig-kaart { background:var(--wit); border-radius:16px; padding:24px; width:100%; max-width:340px; }
    .bevestig-kaart h3 { font-size:18px; color:var(--tekst); margin-bottom:8px; }
    .bevestig-kaart p { font-size:14px; color:var(--grijs-donker); font-weight:400; margin-bottom:20px; }
    .bevestig-knoppen { display:flex; gap:10px; }
    .bevestig-knoppen .knop { flex:1; justify-content:center; }
    .bevestig-kaart.breed { max-width:460px; max-height:88vh; overflow-y:auto; }

    /* ════ SEIZOENEN ════
       De seizoenen van één team. Een rij per seizoen, het jaartal groot
       genoeg om er met een duim langs de lijn op te mikken. */
    .seizoen-lijst { display:flex; flex-direction:column; gap:6px; }
    /* Sinds het weggooien van een los seizoen (18 september 2026) is dit
       geen enkele <button> meer maar een rij met twéé klikdoelen — kiezen
       (seizoen-kies) en, alleen bij een niet-geopend seizoen, verwijderen
       (hergebruikt .team-knop, zie hieronder bij .team-rij). Vandaar dat
       het rand/achtergrond-uiterlijk nu op de omhullende rij staat en niet
       meer op wat ooit de knop zelf was. */
    .seizoen-rij { display:flex; align-items:center; gap:6px; width:100%;
      border:2px solid var(--grijs); border-radius:12px; padding:6px 8px 6px 6px;
      background:var(--wit); }
    .seizoen-rij:hover { border-color:var(--blauw-licht); }
    .seizoen-rij.actief { border-color:var(--blauw); background:var(--vlak-info); }
    .seizoen-kies { flex:1; min-width:0; display:flex; align-items:center; gap:10px;
      background:none; border:none; padding:9px 6px; cursor:pointer; text-align:left;
      font-family:inherit; color:var(--tekst); -webkit-tap-highlight-color:transparent; }
    .seizoen-naam { font-size:15px; font-weight:800; letter-spacing:-.2px;
      font-family:'Helvetica Neue',Arial,sans-serif; }
    .seizoen-bij { flex:1; font-size:12px; color:var(--grijs-donker); font-weight:600; }
    .seizoen-rij.actief .seizoen-bij { color:var(--blauw); }
    .seizoen-kies > i { color:var(--blauw); font-size:13px; }

    .seizoen-pijl { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      margin:0 0 18px; }
    .seizoen-pijl > i { color:var(--grijs-donker); font-size:13px; }
    .seizoen-vak { border:2px solid var(--grijs); border-radius:11px;
      padding:7px 13px; font-size:15px; font-weight:800;
      font-family:'Helvetica Neue',Arial,sans-serif; color:var(--grijs-donker); }
    .seizoen-vak.nieuw { border-color:var(--blauw); color:var(--blauw);
      background:var(--vlak-info); }
    .seizoen-uitleg { font-size:13px; font-weight:700; color:var(--tekst);
      margin:0 0 9px !important; }
    .seizoen-mee { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    @media (min-width:560px) { .seizoen-mee { display:grid; grid-template-columns:1fr 1fr; } }
    .seizoen-optie { display:flex; align-items:flex-start; gap:9px; text-align:left;
      border:2px solid var(--grijs); border-radius:11px; padding:9px 11px;
      background:var(--wit); cursor:pointer; font-family:inherit; color:var(--tekst);
      -webkit-tap-highlight-color:transparent; }
    .seizoen-optie.aan { border-color:var(--blauw); background:var(--vlak-info); }
    .seizoen-optie > i { font-size:15px; margin-top:1px; color:var(--grijs-donker); }
    .seizoen-optie.aan > i { color:var(--blauw); }
    .seizoen-optie b { display:block; font-size:13px; font-weight:700; }
    .seizoen-optie em { display:block; font-size:11.5px; font-style:normal;
      font-weight:400; color:var(--grijs-donker); line-height:1.5; margin-top:2px; }
    .seizoen-blijft { font-size:12.5px !important; line-height:1.65;
      background:var(--grijs-licht); border-radius:11px; padding:11px 13px;
      margin-bottom:18px !important; }
    html[data-thema="donker"] .seizoen-rij,
    html[data-thema="donker"] .seizoen-optie { background:var(--wit); }

    /* ════ PAKKETTEN ════ */
    /* ════ WAT JE MAG ════ */
    .rol-balk { display:flex; align-items:flex-start; gap:11px; margin:6px 0 4px;
      border:2px solid var(--grijs); border-radius:13px; padding:11px 13px;
      background:var(--grijs-licht); }
    .rol-balk.kijker { border-color:var(--oranje); background:var(--vlak-goud); }
    .rol-balk > i { font-size:14px; margin-top:2px; color:var(--grijs-donker); flex-shrink:0; }
    .rol-balk.kijker > i { color:var(--oranje); }
    .rol-balk b { display:block; font-size:13.5px; font-weight:800;
      font-family:'Helvetica Neue',Arial,sans-serif; }
    .rol-balk em { display:block; font-style:normal; font-size:12px; font-weight:400;
      color:var(--grijs-donker); line-height:1.55; margin-top:2px; }
    html[data-thema="donker"] .rol-balk { background:var(--wit); }

    /* ════ INSTELLINGEN: groepen ════
       Vijf groepen in plaats van veertien losse kaarten. Wie zijn taal
       zoekt kijkt onder App en niet in een lijst van boven naar beneden. */
    .inst-groep { font-size:11px; font-weight:800; letter-spacing:1.3px;
      text-transform:uppercase; color:var(--grijs-donker);
      font-family:'Helvetica Neue',Arial,sans-serif;
      margin:20px 2px 8px; }
    .inst-groep:first-of-type { margin-top:6px; }

    /* ════ UITGELEEND ════ */
    .uitleen-rij { border:1.5px solid var(--grijs); border-radius:12px;
      padding:10px 12px 12px; margin-bottom:8px; }
    .uitleen-naam { display:flex; align-items:center; gap:9px; margin-bottom:9px;
      font-size:13.5px; font-weight:700; }
    .uitleen-naam .rol-bol { display:flex; align-items:center; justify-content:center;
      background:var(--grijs-licht); color:var(--grijs-donker); font-size:10px; }
    .uitleen-velden { display:grid; grid-template-columns:1fr; gap:9px; }
    @media (min-width:520px) { .uitleen-velden { grid-template-columns:1fr 1fr; } }
    .uitleen-velden .formulier-input { margin:0; }
    .uitleen-uitleg { font-size:11.5px; color:var(--grijs-donker); font-weight:400;
      line-height:1.6; margin:10px 0 0; }

    /* ════ NOTITIE IN HET WEDSTRIJDCENTRUM ════ */
    .mc-notitie { border:2px solid var(--blauw); border-radius:13px;
      padding:12px 13px 13px; margin-bottom:12px; background:var(--vlak-info); }
    .mc-notitie textarea { margin:0; width:100%; resize:vertical; min-height:76px;
      line-height:1.55; }
    .mc-notitie-kort { display:flex; align-items:flex-start; gap:9px; width:100%;
      text-align:left; border:1.5px solid var(--grijs); border-radius:12px;
      background:var(--grijs-licht); color:var(--tekst); cursor:pointer;
      padding:10px 12px; margin-bottom:12px; font-family:inherit; font-size:12.5px;
      font-weight:500; line-height:1.55; -webkit-tap-highlight-color:transparent; }
    .mc-notitie-kort:hover { border-color:var(--blauw-licht); }
    .mc-notitie-kort > i { color:var(--grijs-donker); font-size:12px; margin-top:2px; flex-shrink:0; }
    .mc-notitie-kort > span { min-width:0; overflow:hidden; display:-webkit-box;
      -webkit-line-clamp:3; -webkit-box-orient:vertical; }
    html[data-thema="donker"] .mc-notitie-kort { background:var(--wit); }

    .pakket-nu { display:flex; align-items:baseline; gap:8px; }
    .pakket-merk { font-size:11px; font-weight:800; letter-spacing:1.4px;
      color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .pakket-naam { font-size:20px; font-weight:800; letter-spacing:-.4px;
      color:var(--blauw); font-family:'Helvetica Neue',Arial,sans-serif; }
    .pakket-raster { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:620px)  { .pakket-raster { grid-template-columns:1fr 1fr; } }
    @media (min-width:1000px) { .pakket-raster { grid-template-columns:repeat(3,1fr); } }
    .pakket-kaart { position:relative; border:2px solid var(--grijs); border-radius:14px;
      padding:15px 15px 13px; background:var(--wit); display:flex; flex-direction:column; gap:9px; }
    .pakket-kaart.nu { border-color:var(--blauw); background:var(--vlak-info); }
    /* Kom je hier binnen via een slotje, dan is er één kaart die het
       antwoord geeft. Die krijgt een gouden rand en verder niets —
       geen tekst, geen badge. Zo hoeft niemand drie kaarten te lezen
       om te zien welke van toepassing is. Via Instellingen komt er
       geen nadruk mee: daar bekijk je het hele overzicht. */
    .pakket-kaart.nadruk { border-color:var(--goud); box-shadow:0 0 0 3px var(--vlak-goud); }
    .pakket-vlag { position:absolute; top:-9px; right:12px; background:var(--blauw);
      color:#fff; font-size:10px; font-weight:800; letter-spacing:.4px;
      padding:3px 9px; border-radius:7px; }
    .pakket-kop { display:flex; flex-direction:column; }
    /* Het bedrag in de kleur van gewone tekst en niet in een accentkleur:
       een prijs is een feit, geen aanbieding. Zwart op wit is bovendien
       het enige dat op een telefoon in de volle zon gegarandeerd
       leesbaar blijft. */
    .pakket-prijs { display:flex; flex-direction:column; gap:2px; }
    .pakket-prijs-rij { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
    .pakket-prijs-bedrag { font-size:24px; font-weight:800; letter-spacing:-.6px;
      color:var(--tekst); font-family:'Helvetica Neue',Arial,sans-serif; }
    .pakket-prijs-per { font-size:12px; font-weight:700; color:var(--grijs-donker); }
    /* Wel kleiner, niet vager: geen opacity en geen lichter grijs dan de
       rest van de kaart al gebruikt. */
    .pakket-prijs-jaar { font-size:11.5px; font-weight:600; line-height:1.5;
      color:var(--grijs-donker); }
    .pakket-teams { font-size:12.5px; font-weight:700; color:var(--grijs-donker); }
    .pakket-lijst { list-style:none; margin:0; padding:0; display:flex;
      flex-direction:column; gap:5px; flex:1; }
    .pakket-lijst li { display:flex; align-items:flex-start; gap:7px;
      font-size:12px; font-weight:600; line-height:1.45; }
    .pakket-lijst li.aan { color:var(--tekst); }
    .pakket-lijst li.uit { color:var(--grijs-donker); opacity:.55; }
    .pakket-lijst li.aan i { color:var(--succes); }
    .pakket-lijst li i { font-size:10px; margin-top:3px; flex-shrink:0; }

    /* ════ WEDSTRIJDEN STIJLEN ════ */
    .w-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--grijs); cursor:pointer; transition:background .15s; }
    .w-item:last-child { border-bottom:none; }
    .w-item:hover { background:var(--grijs-licht); margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:8px; }
    .w-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .w-status-dot.gepland  { background:var(--blauw-licht); }
    .w-status-dot.winst    { background:var(--succes); }
    .w-status-dot.verlies  { background:var(--gevaar); }
    .w-status-dot.gelijk   { background:var(--grijs-donker); }
    .w-info { flex:1; min-width:0; }
    .w-soort { color:#fff; border-radius:99px; padding:1px 7px; font-size:9.5px;
      font-weight:800; margin-left:7px; vertical-align:middle; letter-spacing:.3px;
      white-space:nowrap; }
    .w-tegenstander { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .w-sub { font-size:12px; color:var(--grijs-donker); font-weight:400; margin-top:2px; }
    .w-score-badge { padding:6px 12px; border-radius:8px; font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:15px; color:var(--op-kleur); flex-shrink:0; }
    .w-score-badge.gepland  { background:var(--blauw-licht); font-size:12px; padding:5px 10px; }
    .w-score-badge.winst    { background:var(--succes); }
    .w-score-badge.verlies  { background:var(--gevaar); }
    .w-score-badge.gelijk   { background:var(--grijs-donker); }

    /* Wedstrijd detail banner */
    /* De brede banner boven een wedstrijd is vervangen door .w-kop:
       lager, en hij blijft staan als je scrolt. */

    /* Score invoer */
    .score-invoer { display:flex; align-items:center; justify-content:center; gap:16px; padding:16px 0; }
    .score-blok { display:flex; flex-direction:column; align-items:center; gap:8px; }
    .score-team-label { font-size:12px; font-weight:700; color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; text-transform:uppercase; }
    .score-teller { display:flex; align-items:center; gap:12px; }
    .score-teller button { width:36px; height:36px; border-radius:50%; border:none; background:var(--blauw); color:var(--op-kleur); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; transition:background .2s; }
    .score-teller button:hover { background:var(--blauw-licht); }
    .score-teller span { font-size:40px; font-weight:700; min-width:48px; text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); }
    .score-divider { font-size:28px; color:var(--grijs-donker); font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; }

    /* Event rijen (doelpunt/kaart) */
    .event-rij { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--grijs); }
    .event-rij:last-child { border-bottom:none; }
    .event-icoon { font-size:18px; width:28px; text-align:center; flex-shrink:0; }
    .event-info { flex:1; }
    .event-naam { font-size:14px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif; }
    .event-sub  { font-size:12px; color:var(--grijs-donker); font-weight:400; }
    .event-minuut { font-size:12px; color:var(--grijs-donker); font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; }
    .event-verwijder { background:none; border:none; color:var(--gevaar); font-size:18px; cursor:pointer; padding:0 4px; line-height:1; }

    /* Opstelling rijen */
    .opp-rij { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grijs); }
    .opp-rij:last-child { border-bottom:none; }
    .opp-avatar { width:34px; height:34px; border-radius:50%; background:var(--blauw-licht); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--op-kleur); flex-shrink:0; overflow:hidden; font-family:'Helvetica Neue',Arial,sans-serif; }
    .opp-avatar img, .opp-avatar svg { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .opp-naam { flex:1; font-size:14px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif; }
    .opp-minuten { font-size:13px; color:var(--grijs-donker); font-weight:400; }
    .opp-toggle { width:32px; height:32px; border-radius:6px; border:none; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .1s; flex-shrink:0; }
    .opp-toggle:active { transform:scale(.9); }
    .opp-toggle.start   { background:#d4edda; color:#155724; }
    .opp-toggle.wissel  { background:#fff3cd; color:#856404; }
    .opp-toggle.afwezig { background:#f8d7da; color:#721c24; }
    .opp-rij.afwezig-rij { opacity:.45; }

    /* Speler keuze in modal */
    .speler-keuze-rij { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; cursor:pointer; transition:background .15s; }
    .speler-keuze-rij:hover { background:var(--grijs-licht); }
    .speler-keuze-rij.geselecteerd { background:var(--vlak-info); }

    /* Filter chip */
    .filter-chip { border-radius:999px; padding:5px 12px; border-radius:20px; border:2px solid; font-size:12px; cursor:pointer; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; transition:all .15s; }

    /* Sectie groep in wedstrijd detail */
    .detail-sectie { margin-bottom:12px; }

    /* ════ TRAININGEN STIJLEN ════ */
    .tr-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--grijs); cursor:pointer; transition:background .15s; }
    .tr-item:last-child { border-bottom:none; }
    .tr-item:hover { background:var(--grijs-licht); margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:8px; }
    .tr-datum-blok { width:44px; text-align:center; flex-shrink:0; }
    .tr-datum-dag { font-size:20px; font-weight:700; color:var(--blauw); font-family:'Helvetica Neue',Arial,sans-serif; line-height:1; }
    .tr-datum-mnd { font-size:10px; text-transform:uppercase; color:var(--grijs-donker); font-weight:700; letter-spacing:.5px; }
    .tr-info { flex:1; min-width:0; }
    .tr-naam { font-size:15px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tr-sub { font-size:12px; color:var(--grijs-donker); font-weight:400; margin-top:2px; }
    .tr-badge { padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; background:var(--blauw-licht); color:var(--op-kleur); flex-shrink:0; }
    .aanw-rij { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grijs); }
    .aanw-rij:last-child { border-bottom:none; }
    .aanw-toggle-grp { display:flex; gap:4px; margin-left:auto; }
    .aanw-toggle { padding:4px 8px; border-radius:7px; border:2px solid transparent; cursor:pointer; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; transition:all .15s; background:var(--grijs); color:var(--grijs-donker); }
    .aanw-toggle.actief-aanwezig { background:#d4edda; color:#155724; border-color:#28a745; }
    .aanw-toggle.actief-afwezig { background:#f8d7da; color:#721c24; border-color:var(--gevaar); }
    .aanw-toggle.actief-geblesseerd { background:#fff3cd; color:#856404; border-color:var(--oranje); }
    .onderdeel-kaart { background:var(--grijs-licht); border-radius:12px; padding:14px; margin-bottom:10px; border-left:4px solid var(--blauw-licht); }
    .onderdeel-kaart.type-warmup { border-left-color:var(--oranje); }
    .onderdeel-kaart.type-conditie { border-left-color:var(--gevaar); }
    .onderdeel-kaart.type-wedstrijd { border-left-color:var(--succes); }
    .onderdeel-kaart.type-afkoelen { border-left-color:var(--grijs-donker); }
    .onderdeel-header { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .onderdeel-naam-tekst { font-size:15px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); flex:1; }
    .onderdeel-meta { font-size:12px; color:var(--grijs-donker); margin-top:4px; font-weight:400; }
    .onderdeel-chevron { font-size:13px; color:var(--grijs-donker); transition:transform .2s; display:inline-block; }
    .onderdeel-chevron.open { transform:rotate(180deg); }
    .teken-tool-knop { padding:4px 7px; border-radius:7px; border:2px solid var(--grijs); background:var(--wit); cursor:pointer; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--grijs-donker); transition:all .15s; white-space:nowrap; flex-shrink:0; }
    .teken-tool-knop.actief { border-color:var(--blauw); background:var(--blauw); color:var(--op-kleur); }
    .teken-sep { width:1px; background:var(--grijs); margin:0 2px; align-self:stretch; flex-shrink:0; }
    .teken-bewaar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;
      padding-top:11px; border-top:1px solid var(--grijs); }
    .teken-bewaar-tekst { flex:1; min-width:180px; font-size:12px; color:var(--grijs-donker);
      display:inline-flex; align-items:center; gap:7px; }
    .teken-bewaar-tekst.wacht { color:var(--oranje); font-weight:700; }
    .teken-veld { width:100%; border-radius:10px; display:block; touch-action:none; cursor:crosshair; }
    .agenda-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; }
    .agenda-maand-titel { font-size:18px; font-weight:700; color:var(--blauw); font-family:'Helvetica Neue',Arial,sans-serif; }
    .agenda-nav button { width:36px; height:36px; border-radius:50%; border:2px solid var(--grijs); background:var(--wit); color:var(--tekst); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:border-color .2s; flex-shrink:0; }
    .agenda-nav button:hover { border-color:var(--blauw-licht); }
    .agenda-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .agenda-dag-naam { text-align:center; font-size:10px; font-weight:700; color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; padding:5px 0; }
    .agenda-dag { min-height:58px; border-radius:8px; padding:3px; cursor:pointer; transition:background .15s,box-shadow .15s; overflow:hidden; border:1.5px solid transparent; }
    .agenda-dag:hover { background:var(--grijs-licht); }
    .agenda-dag.vandaag-dag { background:var(--vlak-info); }
    /* Gekozen dag: een rand ipv een vlak, zodat het cijfer altijd leesbaar blijft */
    .agenda-dag.gekozen-dag { border-color:var(--blauw); background:var(--vlak-info); }
    .agenda-dag-nr { font-size:12px; font-weight:700; color:var(--tekst); font-family:'Helvetica Neue',Arial,sans-serif; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:2px; }
    .agenda-dag-nr.vandaag-nr { background:var(--blauw); color:var(--op-kleur); }
    .agenda-dag-nr.grijs-nr { color:var(--grijs-donker); opacity:.45; }
    .agenda-event { font-size:9px; border-radius:3px; padding:1px 4px; margin-bottom:1px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.6; color:#fff; }
    .agenda-event.type-wedstrijd { background:var(--blauw); }
    .agenda-event.type-training { background:var(--blauw-licht); color:var(--op-blauwlicht); }
    .agenda-event-tijd { opacity:.75; margin-right:5px; font-weight:800; }
    .agenda-events { display:flex; flex-direction:column; gap:1px; }
    .agenda-meer { font-size:9px; color:var(--grijs-donker); font-weight:700; padding-left:2px;
      font-family:'Helvetica Neue',Arial,sans-serif; }
    /* Op smalle schermen passen er maar twee, en de tijd laten we dan weg */
    @media (max-width:900px) {
      .agenda-events > .agenda-event:nth-child(3) { display:none; }
      .agenda-event-tijd { display:none; }
    }
    /* Vanaf hier zijn de vakken breed genoeg; alleen de hoogte en de tekst
       schalen mee, de breedte van de agenda blijft ongewijzigd. */
    @media (min-width:1080px) {
      .agenda-grid { gap:5px; }
      .agenda-dag-naam { font-size:12px; padding:8px 0; letter-spacing:.5px; }
      .agenda-dag { min-height:104px; border-radius:12px; padding:7px 8px; border-width:2px; }
      .agenda-dag-nr { font-size:15px; width:30px; height:30px; margin-bottom:5px; }
      .agenda-event { font-size:12px; padding:3px 8px; border-radius:6px; line-height:1.75; }
      .agenda-events { gap:3px; }
      .agenda-meer { font-size:11px; padding-top:2px; }
      .agenda-maand-titel { font-size:23px; }
      .agenda-nav button { width:42px; height:42px; font-size:21px; }
      .agenda-legenda { font-size:12.5px; padding-top:14px; margin-top:16px; }
      .agenda-stip { width:11px; height:11px; }
    }
    @media (min-width:1400px) {
      .agenda-dag { min-height:124px; }
      .agenda-event { font-size:13px; padding:4px 9px; }
      .agenda-dag-nr { font-size:16px; width:32px; height:32px; }
    }
    .agenda-event-item { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px; margin-bottom:8px; cursor:pointer; background:var(--grijs-licht); border-left:4px solid var(--grijs-donker); }
    .agenda-event-item:hover { background:var(--grijs); }
    .agenda-event-item.type-wedstrijd { background:var(--vlak-info); border-left-color:var(--blauw); }
    .agenda-event-item.type-training { background:var(--vlak-info); border-left-color:var(--blauw-licht); }
    .agenda-legenda { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:12px; padding-top:11px; border-top:1px solid var(--grijs); font-size:11px; color:var(--grijs-donker); font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif; }
    .agenda-legenda span { display:inline-flex; align-items:center; gap:6px; }
    /* De legenda zet er zelf al 6px tussen; de marge die het slotje
       overal elders nodig heeft zou hier dubbelop zijn. */
    .agenda-legenda .slot-knop .slotje { margin-left:0; }
    .agenda-stip { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
    .act-icoon { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; color:#fff; }
    /* Vier gelijke vakken in plaats van vakken die zich naar hun tekst
       voegen. "Oefenwedstrijd" is nu eenmaal langer dan "Beker", en met
       auto-fill werd dat ene vak breder en de rij scheef. Nu bepaalt het
       raster de maat en niet het woord. */
    .soort-raster { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    @media (min-width:520px) { .soort-raster { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    .soort-knop { display:flex; align-items:center; justify-content:flex-start; gap:8px;
      min-width:0; min-height:44px; border:2px solid var(--grijs); background:var(--wit);
      color:var(--tekst); border-radius:10px; padding:9px 10px; cursor:pointer;
      font-size:11.5px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif;
      text-align:left; line-height:1.25; -webkit-tap-highlight-color:transparent; }
    .soort-knop i { font-size:13px; flex-shrink:0; }
    .soort-knop.actief { border-color:currentColor; }

    /* ════ OPSTELLINGEN STIJLEN ════ */
    .formatie-keuze-knop { display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--wit); border:2px solid var(--blauw); border-radius:12px; padding:11px 16px; cursor:pointer; margin-bottom:12px; -webkit-tap-highlight-color:transparent; }
    .formatie-keuze-naam { font-size:16px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); }
    .formatie-keuze-hint { font-size:12px; color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .formatie-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:400; display:flex; align-items:flex-end; justify-content:center; animation:inFaden .15s ease; }
    .formatie-sheet { background:var(--wit); border-radius:20px 20px 0 0; width:100%; max-width:var(--venster-breedte); max-height:78vh; overflow-y:auto; padding:16px 16px 32px; animation:inOmhoog .2s ease; -webkit-overflow-scrolling:touch; }
    .formatie-sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--grijs); }
    .formatie-sheet-titel { font-size:16px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); }
    .formatie-groep-label { font-size:10px; font-weight:700; color:var(--grijs-donker); text-transform:uppercase; letter-spacing:.8px; margin:12px 0 7px; font-family:'Helvetica Neue',Arial,sans-serif; }
    .formatie-groep-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .formatie-chip { padding:6px 13px; border-radius:20px; border:2px solid var(--grijs); font-size:12px; font-weight:700; cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif; background:var(--wit); color:var(--grijs-donker); transition:all .12s; -webkit-tap-highlight-color:transparent; }
    .formatie-chip.actief { background:var(--blauw); border-color:var(--blauw); color:white; }
    @keyframes inOmhoog { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    .opgeslagen-formatie { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--grijs); cursor:pointer; }
    .opgeslagen-formatie:last-child { border-bottom:none; }
    .opgeslagen-formatie:hover { background:var(--grijs-licht); margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:8px; }
    .tactiek-kaart { background:var(--grijs-licht); border-radius:12px; padding:14px; margin-bottom:10px; border-left:4px solid var(--blauw); }

    /* ════ STATISTIEKEN STIJLEN ════ */
    .stat-raster-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px; }
    .stat-pill { background:var(--grijs-licht); border-radius:12px; padding:12px 8px; text-align:center; }
    .stat-pill-getal { font-size:22px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); }
    .stat-pill-label { font-size:10px; color:var(--grijs-donker); font-weight:400; margin-top:2px; line-height:1.3; }
    /* ════ LIVE ANALYSE STIJLEN ════ */
    .live-header { background:linear-gradient(135deg,#1a1a2e 0%,var(--blauw) 100%); border-radius:16px; padding:16px; margin-bottom:10px; color:var(--op-kleur); }
    .live-score-display { display:flex; align-items:center; justify-content:center; gap:24px; margin:8px 0 4px; }
    .live-score-getal { font-size:48px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1; }
    .live-score-vs { font-size:20px; opacity:.5; }
    .live-timer-display { text-align:center; padding:10px 0; }
    .live-timer-getal { font-size:54px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); line-height:1; letter-spacing:3px; }
    .live-timer-label { font-size:11px; color:var(--grijs-donker); margin-top:4px; font-weight:400; }
    .live-timer-knoppen { display:flex; gap:8px; justify-content:center; margin-top:10px; }

    .actie-icoon { font-size:20px; display:block; margin-bottom:3px; }
    .actie-label { font-size:10px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; display:block; }
    .speler-keuze-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
    .speler-keuze-knop { border:2px solid var(--grijs); border-radius:10px; padding:8px 4px; cursor:pointer; text-align:center; background:var(--wit); transition:all .15s; -webkit-tap-highlight-color:transparent; }
    .speler-keuze-knop:active { transform:scale(.92); }
    .sk-nr { font-size:18px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--blauw); }

    /* ════ LIVE ANALYSE v2 ════ */
    .live-scoreboard { background:linear-gradient(160deg,#0d1b2a 0%,#004aad 100%); border-radius:16px; padding:14px 16px 0; margin-bottom:10px; color:white; }

    .actie-label-v2 { font-size:12px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.2; color:white; }
    .zone-veld { border-radius:10px; overflow:hidden; margin-bottom:8px; }
    .zone-knop { border:none; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; transition:all .12s; width:100%; }

    .momentum-blok { display:flex; align-items:center; gap:8px; margin-bottom:7px; }

    /* ════ FASE 2: BESCHIKBAARHEID, OPGAVE, STAND, MOTM ════ */
    .besch-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; font-family:'Helvetica Neue',Arial,sans-serif; white-space:nowrap; }

    .opgave-rij { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--grijs); }

    .opgave-knoppen { display:flex; gap:4px; flex-shrink:0; }

    .opgave-tel-label { font-size:10px; color:var(--grijs-donker); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

    .stand-tabel { width:100%; border-collapse:collapse; font-size:13px; }
    .stand-tabel th { font-size:9px; text-transform:uppercase; letter-spacing:.4px; color:var(--grijs-donker); font-weight:700; padding:6px 3px; text-align:center; border-bottom:2px solid var(--grijs); font-family:'Helvetica Neue',Arial,sans-serif; }
    .stand-tabel td { padding:9px 3px; text-align:center; border-bottom:1px solid var(--grijs); font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; }

    .stand-tabel tr.eigen td { background:rgba(0,74,173,.08); color:var(--blauw); }
    .stand-pos { display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:6px; background:var(--grijs); color:var(--grijs-donker); font-size:11px; font-weight:700; }
    .stand-tabel tr.eigen .stand-pos { background:var(--blauw); color:var(--op-kleur); }

    .stand-mini-invoer { width:44px; padding:5px 4px; border:2px solid var(--grijs); border-radius:7px; font-size:13px; font-weight:700; text-align:center; outline:none; font-family:'Helvetica Neue',Arial,sans-serif; }

    .cijfer-invoer { width:48px; padding:5px 6px; border:2px solid var(--grijs); border-radius:8px; font-size:13px; font-weight:700; text-align:center; outline:none; font-family:'Helvetica Neue',Arial,sans-serif; }
    .cijfer-invoer:focus { border-color:var(--blauw-licht); }
    .motm-knop { background:var(--wit); border:2px solid var(--grijs); border-radius:8px; padding:5px 9px; cursor:pointer; font-size:13px; color:var(--grijs-donker); -webkit-tap-highlight-color:transparent; }
    .motm-knop.actief { border-color:#ffc107; background:#fff8e1; color:#7d5906; }
    .motm-banner { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#fff8e1,#ffecb3); border-radius:12px; padding:12px 14px; margin-bottom:12px; border-left:4px solid #ffc107; }

    .wissel-rij { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--grijs); font-size:13px; }
    .wissel-rij:last-child { border-bottom:none; }
    .wissel-pijl-uit { color:var(--gevaar); font-size:12px; }
    .wissel-pijl-in { color:var(--succes); font-size:12px; }

    /* ════ FASE 3: OEFENINGEN, TENUE, GRAFIEKEN ════ */
    .oef-kaart { background:var(--wit); border-radius:12px; padding:12px 14px; margin-bottom:9px; box-shadow:0 1px 4px rgba(0,0,0,0.07); border-left:4px solid var(--blauw-licht); cursor:pointer; transition:transform .1s; }
    .oef-kaart:active { transform:scale(.985); }
    .oef-kop { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .oef-naam { font-size:14px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.3; }
    .oef-meta { font-size:11px; color:var(--grijs-donker); margin-top:3px; display:flex; flex-wrap:wrap; gap:8px; }
    .oef-tag { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--grijs-licht); color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .oef-ster { background:none; border:none; cursor:pointer; font-size:16px; padding:2px 4px; -webkit-tap-highlight-color:transparent; }
    .oef-filterbalk { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
    .oef-filterbalk::-webkit-scrollbar { display:none; }

    .tenue-voorbeeld { width:44px; height:44px; border-radius:50%; border:2.5px solid rgba(255,255,255,.9); box-shadow:0 2px 8px rgba(0,0,0,.3); flex-shrink:0; }
    .tenue-kleurkiezer { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
    .tenue-kleur-input { width:44px; height:36px; border:2px solid var(--grijs); border-radius:9px; padding:2px; cursor:pointer; background:var(--wit); }
    .tenue-patroon-rij { display:flex; gap:6px; flex-wrap:wrap; }
    .tenue-patroon { flex:1; min-width:62px; border:2px solid var(--grijs); background:var(--wit); border-radius:10px; padding:8px 4px; cursor:pointer; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--grijs-donker); display:flex; flex-direction:column; align-items:center; gap:5px; -webkit-tap-highlight-color:transparent; }
    .tenue-patroon-swatch { width:26px; height:26px; border-radius:50%; border:1.5px solid rgba(0,0,0,.15); }
    .tenue-soorten { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; }
    .tenue-soort { flex:0 0 auto; border:2px solid var(--grijs); background:var(--wit); border-radius:12px;
      padding:7px 12px; cursor:pointer; font-size:12px; font-weight:800; color:var(--grijs-donker);
      font-family:'Helvetica Neue',Arial,sans-serif; display:flex; align-items:center; gap:7px;
      -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    .tenue-soort.actief { border-color:var(--blauw); color:var(--blauw); background:rgba(0,74,173,.06); }
    .tenue-stip { width:15px; height:15px; border-radius:50%; border:1.5px solid rgba(0,0,0,.18); flex-shrink:0; }
    .tenue-podium { display:flex; gap:22px; justify-content:center; align-items:flex-end; flex-wrap:wrap;
      background:linear-gradient(160deg,#e9edf2,#cfd6de); border-radius:16px; padding:20px 14px 16px; }
    .tenue-kant { font-size:10.5px; font-weight:800; color:#5a6472; text-align:center; margin-top:8px;
      font-family:'Helvetica Neue',Arial,sans-serif; letter-spacing:.4px; }
    .tenue-let-op { display:flex; gap:9px; align-items:flex-start; background:#fff7e6; border:1px solid #f2d492;
      border-radius:11px; padding:10px 12px; font-size:12px; color:#8a5a00; font-weight:600;
      font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.5; margin-top:10px; }
    .tenue-rij { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 14px; }
    .tenue-groepbalk { display:flex; gap:5px; overflow-x:auto; background:var(--blauw); border-radius:12px;
      padding:6px; margin-bottom:10px; }
    .tenue-groep { flex:1 0 auto; min-width:44px; border:none; background:transparent; color:rgba(255,255,255,.72);
      border-radius:9px; padding:8px 6px; cursor:pointer; font-size:10px; font-weight:800; display:flex;
      flex-direction:column; align-items:center; gap:4px; font-family:'Helvetica Neue',Arial,sans-serif;
      -webkit-tap-highlight-color:transparent; }
    .tenue-groep i { font-size:15px; }
    .tenue-groep.actief { background:var(--wit); color:var(--blauw); }
    .tenue-vormen { display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:7px; }
    .tenue-vormknop { aspect-ratio:1; border:2px solid var(--grijs); background:var(--wit); border-radius:10px;
      padding:5px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent; }
    .tenue-vormknop:active { border-color:var(--blauw); }
    .tenue-doek { position:relative; touch-action:none; cursor:grab; max-height:100%; }
    .tenue-doek.sleept { cursor:grabbing; }
    .tenue-lagen { display:flex; flex-direction:column; gap:6px; }
    .tenue-laagrij { display:flex; align-items:center; gap:8px; border:2px solid var(--grijs);
      border-radius:11px; padding:6px 8px; background:var(--wit); }
    .tenue-laagrij.actief { border-color:var(--blauw); background:rgba(0,74,173,.05); }
    .tenue-laagbeeld { width:30px; height:30px; flex-shrink:0; border-radius:7px; background:#eef1f5;
      display:flex; align-items:center; justify-content:center; }
    .tenue-laagnaam { flex:1; min-width:0; font-size:12.5px; font-weight:700; color:var(--tekst);
      font-family:'Helvetica Neue',Arial,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tenue-laagknop { border:none; background:#eef1f5; color:var(--grijs-donker); width:27px; height:27px;
      border-radius:8px; cursor:pointer; font-size:11px; flex-shrink:0;
      -webkit-tap-highlight-color:transparent; }
    .tenue-laagknop.weg { background:#fdecec; color:var(--gevaar); }
    .tenue-schuif { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .tenue-schuif label { font-size:11.5px; font-weight:700; color:var(--grijs-donker); width:64px;
      flex-shrink:0; font-family:'Helvetica Neue',Arial,sans-serif; }
    .tenue-schuif input[type=range] { flex:1; accent-color:var(--blauw); }
    .tenue-schuif .waarde { font-size:11px; color:var(--grijs-donker); width:38px; text-align:right;
      font-variant-numeric:tabular-nums; }
    .tenue-leeg { text-align:center; font-size:12px; color:var(--grijs-donker); padding:14px 8px;
      font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.6; }
    .tenue-strook { background:var(--wit); border:1px solid var(--grijs); border-radius:12px;
      padding:9px 10px; margin-bottom:10px; }
    .tenue-strook-beelden { display:flex; gap:14px; justify-content:center; align-items:flex-end; }
    .tenue-strook-label { font-size:9.5px; font-weight:800; color:var(--grijs-donker);
      text-align:center; margin-top:3px; font-family:'Helvetica Neue',Arial,sans-serif;
      letter-spacing:.3px; }
    .tenue-strook-keuze { display:flex; gap:5px; justify-content:center; margin-top:8px; }

    /* Alles op één scherm: drie kolommen die zelf schuiven, zodat de
       pagina eromheen stil blijft staan. */
    /* De hoogte wordt afgetrokken van wat er boven en onder staat:
       de bovenbalk van de pagina, de titelregel en de twee rijen
       knoppen. Zo hoeft de pagina zelf niet meer te schuiven. */
    .tenue-werkblad { display:grid; gap:10px; grid-template-columns:238px minmax(0,1fr) 146px;
      height:calc(100vh - var(--rand-marge) * 2 - var(--nav-hoogte) - 172px);
      min-height:420px; }
    .tenue-kolom { background:var(--wit); border:1px solid var(--grijs); border-radius:14px;
      display:flex; flex-direction:column; overflow:hidden; min-height:0; }
    .tenue-kolomkop { font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
      color:var(--grijs-donker); padding:8px 10px 6px; font-family:'Helvetica Neue',Arial,sans-serif;
      border-bottom:1px solid var(--grijs); flex-shrink:0; }
    .tenue-schuifgebied { overflow-y:auto; padding:9px; flex:1; min-height:0; }
    /* De tekening zit in een vak dat kan schuiven zodra je inzoomt.
       Centreren gebeurt met marge en niet met justify-content: dat
       laatste knipt bij het schuiven de bovenkant weg. */
    .tenue-doekvak { position:relative; flex:1; min-height:0; display:flex;
      background:linear-gradient(160deg,#e9edf2,#cfd6de); border-radius:14px; }
    /* touch-action:none omdat we het schuiven en knijpen zelf doen.
       Laat je dat aan de browser over, dan neemt die bij twee vingers
       het paginazoomen over en komt onze knijpbeweging nooit aan. */
    .tenue-midden { display:flex; overflow:auto; flex:1; min-height:0; padding:10px;
      border-radius:14px; touch-action:none; }
    .tenue-doek { margin:auto; flex:0 0 auto; }
    .tenue-doek svg { max-width:none; max-height:none; display:block; }
    .tenue-mini { position:absolute; right:10px; top:10px; opacity:.9; text-align:center; }
    .tenue-hoekknoppen { position:absolute; left:10px; top:10px; display:flex; gap:6px; z-index:2; }
    .tenue-zoomknoppen { position:absolute; left:10px; bottom:10px; display:flex; gap:6px;
      align-items:center; z-index:2; background:rgba(255,255,255,.92); border-radius:10px;
      padding:3px 4px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .tenue-zoomknoppen button { border:none; background:transparent; color:var(--grijs-donker);
      width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:12px;
      -webkit-tap-highlight-color:transparent; }
    .tenue-zoomknoppen button:disabled { opacity:.3; cursor:default; }
    .tenue-zoomwaarde { font-size:11px; font-weight:800; color:var(--grijs-donker);
      min-width:38px; text-align:center; font-variant-numeric:tabular-nums;
      font-family:'Helvetica Neue',Arial,sans-serif; cursor:pointer; }
    .tenue-wisknop { border:none; border-radius:9px;
      background:rgba(255,255,255,.92); color:var(--grijs-donker); width:32px; height:32px;
      cursor:pointer; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.2);
      -webkit-tap-highlight-color:transparent; }
    .tenue-wisknop.weg { color:var(--gevaar); }
    .tenue-wisknop:disabled { opacity:.35; cursor:default; }
    .tenue-gereed { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center;
      padding:8px 9px; border-top:1px solid var(--grijs); background:var(--wit);
      border-radius:0 0 14px 14px; flex-shrink:0; }
    .tenue-veld { display:flex; align-items:center; gap:4px; background:#eef1f5; border-radius:8px;
