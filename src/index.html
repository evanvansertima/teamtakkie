      transition:all .13s; -webkit-tap-highlight-color:transparent; }
    .pres-filter-knop:hover { border-color:var(--blauw-licht); color:var(--blauw); }
    .pres-filter-knop.actief { border-color:var(--blauw); background:var(--blauw); color:var(--op-kleur); }
    .pres-teller { font-size:10px; font-weight:800; background:var(--grijs-licht); color:var(--grijs-donker);
      border-radius:10px; padding:1px 6px; }
    .pres-filter-knop.actief .pres-teller { background:rgba(255,255,255,.25); color:var(--op-kleur); }
    .pres-soort-streep { display:block; height:3px; border-radius:2px; margin:0 2px 4px; }
    .pres-totaal td { padding-top:9px; border-top:2px solid var(--grijs); font-size:11px;
      font-weight:800; color:var(--grijs-donker); }
    .pres-totaal .opk-naam-kol { font-size:10px; text-transform:uppercase; letter-spacing:.6px; }
    .pres-kolom-pct { font-size:10px; font-weight:800; }

    /* ── AANWEZIGHEID ── */
    .opk-balk { display:flex; height:9px; border-radius:5px; overflow:hidden; gap:2px; margin:4px 0 9px; }
    .opk-balk span { display:block; }
    .opk-legenda { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:14px; font-size:11.5px;
      color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .opk-legenda-item { display:inline-flex; align-items:center; gap:6px; }
    .opk-stip { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
    .opk-kop { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800;
      text-transform:uppercase; letter-spacing:.5px; margin:14px 0 8px;
      font-family:'Helvetica Neue',Arial,sans-serif; }
    .opk-letter { min-width:22px; height:20px; padding:0 5px; border-radius:6px; display:inline-flex;
      align-items:center; justify-content:center; font-size:10.5px; font-weight:800; letter-spacing:0; }

    .opk-tabel-wrap { overflow-x:auto; margin:0 -4px; padding:0 4px; }
    .opk-tabel { border-collapse:separate; border-spacing:0 3px; width:100%;
      font-family:'Helvetica Neue',Arial,sans-serif; }
    .opk-tabel th { font-size:10px; font-weight:800; color:var(--grijs-donker); padding:0 3px 7px;
      text-align:center; white-space:nowrap; }
    .opk-tabel td { padding:0 3px; text-align:center; vertical-align:middle; }
    .opk-tabel .opk-naam-kol { text-align:left; position:sticky; left:0; background:var(--wit);
      padding-right:10px; min-width:160px; z-index:2; }
    .opk-tabel th.opk-naam-kol { z-index:3; }
    .opk-dag { display:block; font-size:12px; color:var(--tekst); line-height:1.1; }
    .opk-mnd { display:block; font-size:8.5px; text-transform:uppercase; letter-spacing:.4px; }
    .opk-speler { display:flex; align-items:center; gap:8px; min-width:0; }
    .opk-speler-naam { font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; }
    .opk-cel { display:inline-flex; align-items:center; justify-content:center; min-width:26px;
      height:24px; padding:0 4px; border-radius:6px; font-size:10.5px; font-weight:800; }
    .opk-cel.leeg { background:var(--grijs-licht); color:var(--grijs-donker); font-weight:400; opacity:.6; }
    /* Een vastgelegde periode loopt door: de vakjes plakken aan elkaar
       tot één balk, zodat je in één oogopslag ziet dat het geen losse
       afmeldingen zijn maar één blessure. */
    .opk-cel.door-links  { border-top-left-radius:0;  border-bottom-left-radius:0;
      margin-left:-3px; padding-left:7px; }
    .opk-cel.door-rechts { border-top-right-radius:0; border-bottom-right-radius:0;
      margin-right:-3px; padding-right:7px; }
    .opk-cel.buiten-telling { opacity:.82; }
    .pres-weinig .opk-speler-naam, .pres-weinig .opk-pct { opacity:.6; }
    .opk-pct-kol { text-align:right !important; padding-left:12px !important; white-space:nowrap; }
    .opk-pct { font-size:14px; font-weight:800; }
    .opk-pct-sub { display:block; font-size:10px; color:var(--grijs-donker); margin-top:1px; }

    /* ── SPELERKAART ── */
    .sp-buste { width:54px; height:54px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:center;
      overflow:hidden; }
    .sp-buste img { width:100%; height:100%; object-fit:cover; border-radius:12px; display:block; }
    .sp-status { display:inline-flex; align-items:center; gap:5px; margin-top:5px; font-size:10px; font-weight:700;
      border:1.5px solid; border-radius:20px; padding:2px 8px; line-height:1.5;
      font-family:'Helvetica Neue',Arial,sans-serif; white-space:nowrap; }
    .sp-rating-rij { display:flex; gap:10px; margin:11px 0 9px; }
    .sp-rating { flex:1; min-width:0; background:var(--grijs-licht); border-radius:10px; padding:7px 9px; }
    .sp-rating-getal { font-size:19px; font-weight:800; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.15; margin-top:2px; }
    .sp-rating-max { font-size:11px; font-weight:700; color:var(--grijs-donker); margin-left:1px; }
    .sp-balkjes { display:flex; gap:3px; margin-top:7px; }
    .sp-balk { flex:1; height:9px; border-radius:2px; background:var(--grijs); }
    .sp-balk.aan { background:linear-gradient(180deg,#4ade80,#16a34a); }
    .sp-voet { display:flex; align-items:center; gap:11px; flex-wrap:nowrap; margin-top:auto;
      padding-top:9px; border-top:1px solid var(--grijs); overflow:hidden; }
    .sp-voet-item { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
      color:var(--tekst); font-family:'Helvetica Neue',Arial,sans-serif; white-space:nowrap; flex-shrink:0; }
    .sp-voet-item.leeg { color:var(--grijs-donker); font-weight:400; }
    .sp-kaartje { width:9px; height:12px; border-radius:2px; display:inline-block; flex-shrink:0;
      border:1px solid rgba(0,0,0,.22); }
    .sp-kaartje.geel { background:#f5c518; }
    .sp-kaartje.rood { background:#dc3545; }
    .sp-voet-item.leeg .sp-kaartje { opacity:.35; }

    /* ── WEEKINDELING ── */
    .week-groep { margin-bottom:16px; }
    .week-kop { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:7px; padding:0 2px; }
    .week-nr { font-size:12px; font-weight:800; color:var(--blauw); text-transform:uppercase; letter-spacing:.7px; font-family:'Helvetica Neue',Arial,sans-serif; }
    .week-bereik { font-size:12px; color:var(--grijs-donker); font-weight:600; }
    .week-nu { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; background:var(--blauw); color:var(--op-kleur); border-radius:20px; padding:2px 8px; font-family:'Helvetica Neue',Arial,sans-serif; }
    .week-tel { font-size:11.5px; color:var(--grijs-donker); margin-left:auto; }
    .week-kop.nu .week-bereik { color:var(--blauw); }
    .week-rij { margin-bottom:0; padding:6px 18px; }
    @media (min-width:1080px) {
      /* Binnen een week wel naast elkaar, maar de weken blijven onder elkaar */
      .week-rij { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:0 26px; }
      .week-rij > .tr-item:last-child { border-bottom:none; }
    }

    /* ── WERKVENSTER: opstelling, rollen en tactiek als popup ── */
    .venster-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:440;
      display:flex; align-items:center; justify-content:center; padding:0; animation:fadeIn .18s ease; }
    .venster { background:var(--grijs-licht); width:100%; height:100%; max-width:100%; max-height:100%;
      display:flex; flex-direction:column; animation:slideUp .22s ease; }
    @media (min-width:820px) {
      .venster-overlay { padding:24px; }
      .venster { max-width:var(--venster-breedte); max-height:92vh; border-radius:18px; overflow:hidden;
        box-shadow:0 18px 60px rgba(0,0,0,.35); }
      .venster.breed { max-width:min(1400px, 96vw); }
    }
    .venster-kop { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:13px 16px;
      background:var(--wit); border-bottom:1px solid var(--grijs); }
    .venster-titel { font-size:17px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif;
      color:var(--tekst); line-height:1.2; }
    .venster-sub { font-size:11.5px; color:var(--grijs-donker); margin-top:2px; }
    .venster-sluit { width:34px; height:34px; border-radius:10px; border:1px solid var(--grijs);
      background:var(--wit); color:var(--grijs-donker); cursor:pointer; font-size:14px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    .venster-sluit:hover { border-color:var(--gevaar); color:var(--gevaar); }
    .venster-body { flex:1; min-height:0; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
    .venster-voet { flex-shrink:0; display:flex; gap:10px; padding:12px 16px;
      background:var(--wit); border-top:1px solid var(--grijs); }
    /* Voet van de opstelling plakt onderaan het scrollgebied */
    .venster-voet-plakt { position:sticky; bottom:-16px; margin:14px -16px -16px; z-index:4; }
    .venster-body > .kaart:first-child { margin-top:0; }
    html[data-thema="donker"] .venster-kop, html[data-thema="donker"] .venster-voet { background:#15171e; }

    /* ── ACTIEKNOPPEN OP HET WEDSTRIJDSCHERM ── */
    /* Zoveel knoppen naast elkaar als er passen. Met vier vaste
       kolommen stond de vijfde in zijn eentje op een tweede rij. */
    .wedstrijd-acties { display:grid; gap:8px; margin-bottom:12px;
      grid-template-columns:repeat(auto-fit, minmax(158px, 1fr)); }
    .wedstrijd-acties .knop { justify-content:center; position:relative; }
    .actie-teller { position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 5px;
      border-radius:10px; background:var(--oranje); color:#fff; font-size:10px; font-weight:800;
      display:flex; align-items:center; justify-content:center; line-height:1;
      border:2px solid var(--wit); font-family:'Helvetica Neue',Arial,sans-serif; }
    .bewaar-melder { display:inline-flex; align-items:center; gap:6px; font-size:11px;
      background:var(--grijs-licht); border:1px solid var(--grijs); color:var(--grijs-donker);
      border-radius:20px; padding:5px 11px; font-weight:600; white-space:nowrap; flex-shrink:0;
      font-family:'Helvetica Neue',Arial,sans-serif; transition:background .2s,color .2s,border-color .2s; }
    .bewaar-melder.net { background:var(--vlak-succes); border-color:var(--succes); color:var(--op-succesvlak); }

    /* ── TACTIEK ── */
    .tac-fase { padding:11px 0; border-bottom:1px solid var(--grijs); }
    .tac-fase:last-child { border-bottom:none; }
    .tac-fase-kop { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:700; margin-bottom:8px; font-family:'Helvetica Neue',Arial,sans-serif; }
    .tac-fase-icoon { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; flex-shrink:0; }
    .tac-tips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
    .tac-tip { border:1px solid var(--grijs); background:var(--grijs-licht); color:var(--grijs-donker); border-radius:14px; padding:4px 10px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif; text-align:left; line-height:1.35; -webkit-tap-highlight-color:transparent; }
    .tac-tip:hover { border-color:var(--blauw); color:var(--blauw); }
    .tac-rij { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--grijs); cursor:pointer; }
    .tac-rij:last-child { border-bottom:none; }
    .tac-opdracht { display:block; font-size:11.5px; line-height:1.5; margin-top:3px; color:var(--grijs-donker); }
    .tac-opdracht.aanval i { color:var(--succes); width:13px; }
    .tac-opdracht.verdediging i { color:var(--gevaar); width:13px; }

    /* ── SPELERSROLLEN ── */
    .rol-raster { display:grid; grid-template-columns:1fr; gap:9px; }
    @media (min-width:640px) { .rol-raster { grid-template-columns:1fr 1fr; } }
    @media (min-width:1200px) { .rol-raster { grid-template-columns:1fr 1fr 1fr; } }
    .rol-kaart { display:flex; align-items:center; gap:11px; border:1.5px solid var(--grijs); border-radius:13px;
      padding:11px 12px; background:var(--wit); cursor:pointer; text-align:left; width:100%;
      transition:border-color .15s,transform .1s; -webkit-tap-highlight-color:transparent; }
    .rol-kaart:hover { border-color:var(--blauw-licht); }
    .rol-kaart:active { transform:scale(.99); }
    .rol-kaart.gevuld { border-color:var(--grijs); background:var(--grijs-licht); }
    .rol-icoon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:16px; flex-shrink:0; position:relative; }
    .rol-kort { position:absolute; bottom:-4px; right:-4px; background:var(--wit); color:var(--tekst);
      border:1.5px solid var(--grijs); border-radius:6px; font-size:8px; font-weight:800; padding:1px 3px;
      line-height:1.2; font-family:'Helvetica Neue',Arial,sans-serif; }
    .rol-naam { font-size:13px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.25; }
    .rol-speler { font-size:12px; margin-top:3px; display:flex; align-items:center; gap:6px; min-width:0; }
    .rol-bol { width:22px; height:22px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--blauw-licht); }
    .rol-leeg { font-size:12px; color:var(--grijs-donker); margin-top:3px; font-style:italic; }
    /* Iemand die niet in de selectie zit heeft geen pasfoto. Een poppetje
       in plaats van een lege cirkel maakt meteen duidelijk waaróm niet. */
    .rol-bol.rol-buiten { display:flex; align-items:center; justify-content:center;
      background:var(--grijs-licht); color:var(--grijs-donker); font-size:10px; }
    .rol-buitenveld { border:2px dashed var(--grijs); border-radius:12px;
      padding:11px 12px; margin-bottom:12px; }
    .rol-buitenveld .formulier-label { margin-bottom:7px; }
    .rol-tel { font-size:10px; color:var(--grijs-donker); font-weight:600; }
    /* Aanvoerdersband op het veld */
    .band-c { position:absolute; top:-3px; left:-4px; width:16px; height:16px; border-radius:5px;
      background:#d4a017; color:#3b2c05; border:1.5px solid rgba(255,255,255,.92);
      display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900;
      line-height:1; font-family:'Helvetica Neue',Arial,sans-serif; box-shadow:0 1px 3px rgba(0,0,0,.4); }
    html[data-thema="donker"] .rol-kaart { background:var(--wit); }
    html[data-thema="donker"] .rol-kaart.gevuld { background:#0f1116; }

    /* ══════════════════════════════════════════════════════
       BREDE SCHERMEN
       Meer breedte helpt alleen als de inhoud die ook gebruikt.
       Rijen die anders eindeloos uitrekken worden hier kolommen.
    ══════════════════════════════════════════════════════ */
    @media (min-width:1080px) {
      .stat-raster { grid-template-columns:repeat(4,1fr); gap:12px; }
      .snelkoppeling-raster { grid-template-columns:repeat(6,1fr); }

      .lijst-raster { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:0 26px; }
      .lijst-raster > .w-item:hover,
      .lijst-raster > .tr-item:hover,
      .lijst-raster > .speler-rij:hover { margin:0 -10px; padding-left:10px; padding-right:10px; }
      /* In kolomvorm houdt elk item zijn scheidingslijn, anders mist
         de onderste rij er willekeurig een paar */
      .lijst-raster > .w-item:last-child,
      .lijst-raster > .tr-item:last-child,
      .lijst-raster > .speler-rij:last-child { border-bottom:1px solid var(--grijs); }
      .oef-raster { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; align-items:start; }
      .oef-raster > .oef-kaart { margin-bottom:0; }

      /* Spelerkaarten: liever een paar grote dan een rij kleine */
      .sp-raster-kaarten { grid-template-columns:repeat(3,1fr); gap:14px; }
      .sp-kaart { padding:16px 17px; border-radius:16px; }
      .sp-kaart-kop { gap:12px; margin-bottom:13px; }
      .sp-buste { width:64px; height:64px; }
      .sp-kaart-naam { font-size:16px; }
      .sp-kaart-pos { font-size:11px; }
      .sp-kaart-cijfers { gap:7px; }
      .sp-kaart-vak { padding:9px 2px; border-radius:10px; }
      .sp-kaart-getal { font-size:18px; }
      .sp-kaart-label { font-size:9px; margin-top:4px; }

      .md-raster { grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); }
    }
    @media (min-width:1500px) {
      .lijst-raster { grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); }
      .oef-raster { grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
      .sp-raster-kaarten { grid-template-columns:repeat(4,1fr); }
    }

    /* ══════════════════════════════════════════════════════
       TEKENBORD
       Ingebed: gereedschap links in twee smalle kolommen,
       veld midden, regelaars rechts, frames onderin.
       Volledig scherm: hetzelfde, maar met het veld zo groot
       als het scherm toelaat.
    ══════════════════════════════════════════════════════ */
    .bord { display:flex; flex-direction:column; gap:9px; }
    .bord-werkvlak { display:flex; flex-direction:column; gap:9px; min-width:0; }
    .bord-veld { min-width:0; position:relative; display:flex; flex-direction:column; }
    /* ── EEN VASTE TEKENRUIMTE ──
       Hier stond width:100%;height:auto. Het doek was dus altijd zo
       breed als de kolom en de HOOGTE volgde de verhouding van het
       gekozen veld: liggend 1,57 — staand 0,69 — een helft 1,34. Bij
       elke andere veldkeuze werd het doek dus een andere hoogte, en
       schoof alles eronder mee: de frames, de knoppen. Vandaar het
       scrollen en het verspringen.

       Nu heeft de tekenruimte een vaste maat, bepaald door de breedte
       van de kolom en de hoogte van het scherm — niet door het veld.
       Het veld wordt er gecentreerd in gepast. Kies je een staand veld,
       dan wordt het smaller, maar niet hoger of lager. Onder het doek
       beweegt daardoor nooit meer iets. */
    .bord-doek { position:relative; min-width:0; min-height:0;
      display:flex; align-items:center; justify-content:center;
      width:100%; aspect-ratio:580 / 370; max-height:38vh; }
    .bord-doek .teken-veld { width:auto; height:auto; max-width:100%; max-height:100%; flex-shrink:0; }
    @media (min-width:900px) { .bord-doek { max-height:56vh; } }

    .bord-groot { position:absolute; top:8px; right:8px; z-index:3; border:none; border-radius:9px; padding:6px 10px; background:rgba(10,20,12,.62); color:#fff; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:6px; -webkit-tap-highlight-color:transparent; }
    .bord-groot:hover { background:rgba(10,20,12,.85); }

    .bord-rail { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    .rail-knop { width:38px; height:34px; border-radius:9px; border:2px solid var(--grijs); background:var(--wit); color:var(--grijs-donker); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .13s; -webkit-tap-highlight-color:transparent; }
    .rail-knop:hover { border-color:var(--blauw-licht); color:var(--blauw); }
    .rail-knop.actief { border-color:var(--blauw); background:var(--blauw); color:var(--op-kleur); }
    .rail-knop .rail-tekst { font-size:9.5px; font-weight:800; font-family:'Helvetica Neue',Arial,sans-serif; }
    .rail-scheiding { width:1px; align-self:stretch; background:var(--grijs); margin:0 3px; flex-shrink:0; }

    /* Het paneel is het enige dat van hoogte verschilt — een spelerslijst
       is nu eenmaal langer dan drie knoppen. Het scrolt daarom in
       zichzelf, zodat de rest van het bord blijft staan waar het staat
       en je nooit de pagina hoeft te verschuiven voor een frame. */
    .bord-zij { display:flex; flex-direction:column; gap:10px; min-width:0;
      max-height:30vh; overflow-y:auto; }
    .bord-vak { border:1px solid var(--grijs); border-radius:12px; padding:10px 11px; background:var(--wit); }
    .bord-vak-kop { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.9px; color:var(--grijs-donker); margin-bottom:8px; font-family:'Helvetica Neue',Arial,sans-serif; display:flex; align-items:center; gap:6px; }
    .bord-vak-kop .knop { margin-left:auto; }
    /* Een raster en geen losse rij: met flex-wrap sprong de laatste rij
       naar links uit en stond niets meer onder elkaar. Vier kolommen van
       38 pixels passen precies in het paneel, en materiaal, zones,
       lijnen en objecten lijnen daardoor allemaal hetzelfde uit. */
    .bord-knoppen { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:4px; }
    .bord-knoppen > .rail-knop { width:100%; }
    .nr-knop { min-width:26px; height:26px; padding:0 5px; border-radius:7px; border:2px solid var(--grijs); background:var(--wit); color:var(--grijs-donker); font-size:11px; font-weight:700; cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
    .lijnnr-raster { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .lijnnr-knop { height:26px; padding:0; border-radius:7px; border:2px solid var(--grijs);
      background:var(--wit); color:var(--grijs-donker); font-size:11px; font-weight:800;
      cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif;
      -webkit-tap-highlight-color:transparent; transition:all .12s; }
    .lijnnr-knop:hover { border-color:var(--blauw-licht); color:var(--blauw); }
    .lijnnr-knop.actief { border-color:var(--blauw); background:var(--blauw); color:var(--op-kleur); }
    .lijnnr-knop.geen { color:var(--grijs-donker); }
    .lijnnr-knop.geen.actief { border-color:var(--grijs-donker); background:var(--grijs-donker); color:#fff; }
    .lijnnr-hint { font-size:10.5px; color:var(--grijs-donker); line-height:1.6; margin-top:8px;
      display:flex; align-items:center; flex-wrap:wrap; gap:2px; }
    .team-stip { width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }

    /* ════ VELD ALS PICTOGRAM ════
       Op een breed scherm staan de veldvormen onder elkaar in een smalle
       tweede kolom, zoals je het bij elk tekenbord ziet: links waar je
       kiest, daarnaast wat je kunt kiezen, en de rest is veld. Alle
       knoppen even groot, zodat de vormen netjes onder elkaar uitlijnen
       en het oog er in een keer langs kan. Op een telefoon is een kolom
       van negen te lang, daar lopen ze door in een rij. */
    .veld-raster { display:flex; flex-wrap:wrap; gap:5px; }
    .veld-knop { display:flex; align-items:center; justify-content:center;
      width:58px; height:52px; flex:0 0 58px;
      padding:4px; border:2px solid var(--grijs); border-radius:10px;
      background:var(--wit); color:var(--grijs-donker); cursor:pointer;
      -webkit-tap-highlight-color:transparent; transition:all .13s; }
    .veld-knop:hover { border-color:var(--blauw-licht); color:var(--blauw); }
    .veld-knop.actief { border-color:var(--blauw); background:var(--vlak-info); color:var(--blauw); }
    .veld-icoon { display:block; }
    html[data-thema="donker"] .veld-knop { background:var(--wit); }

    /* ── De smalle tweede kolom ──
       Deze regels stonden eerst alléén binnen de mediaregel voor brede
       schermen. In volledig scherm is de kolom óók smal, ook op een
       iPad staand — en daar liepen Plat, Schuin en Laag over elkaar
       heen. Toen ik ze buiten de mediaregel zette golden ze juist
       overal, ook waar het paneel schermbreed is: drie lege balken over
       de volle breedte. Ze horen bij een kolom die écht smal is, en dat
       zijn er precies twee: ingebed op een breed scherm, en altijd in
       volledig scherm. Vandaar allebei de selectors. */
    .bord-vol .bord-zij.smal .veld-raster { flex-direction:column; flex-wrap:nowrap; }
    .bord-vol .bord-zij.smal .veld-knop { width:100%; flex:0 0 auto; }
    .bord-vol .bord-zij.smal .bord-knoppen { grid-template-columns:1fr; }
    .bord-vol .bord-zij.smal .knop-woord { display:none; }

    .bord-frames { border:1px solid var(--grijs); border-radius:12px; padding:9px 10px; background:var(--grijs-licht); }
    .frame-strook { display:flex; gap:7px; overflow-x:auto; padding-bottom:3px; scrollbar-width:thin; align-items:flex-start; }
    .frame-vak { flex-shrink:0; width:78px; border:2px solid var(--grijs); border-radius:9px; overflow:hidden; background:var(--wit); cursor:pointer; padding:0; transition:border-color .13s,transform .13s; -webkit-tap-highlight-color:transparent; }
    .frame-vak:hover { border-color:var(--blauw-licht); }
    .frame-vak.actief { border-color:var(--blauw); transform:translateY(-2px); }
    .frame-mini { width:100%; display:block; background:#2e8b2e; }
    .frame-label { font-size:10px; font-weight:700; padding:3px 0; color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .frame-vak.actief .frame-label { color:var(--blauw); }
    .frame-nieuw { flex-shrink:0; width:78px; min-height:64px; border:2px dashed var(--grijs); border-radius:9px; background:none; color:var(--blauw); cursor:pointer; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; -webkit-tap-highlight-color:transparent; }
    .frame-nieuw span { font-size:9.5px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; }
    .frame-balk { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px; }

    /* Ingebed vanaf 900px: rail in twee kolommen zodat hij
       niet langer wordt dan het veld hoog is */
    /* ── Kolom, paneel, veld ──
       Eerst stond het paneel rechts van het veld en de rail links, in
       twee kolommen naast elkaar: samen 274 pixels aan gereedschap om
       het veld heen. Nu staan ze allebei links, het paneel klapt weg als
       je het niet gebruikt, en alles wat overblijft is voor het veld.

       Flex en geen grid, omdat het paneel er soms niet is. Een
       rasterkolom die leeg blijft houdt zijn breedte; een flex-element
       dat er niet is, neemt niets in. */
    @media (min-width:900px) {
      /* flex-direction:row moet er expliciet bij staan. De regel
         hierboven zet hem op column voor smalle schermen, en die blijft
         anders gewoon gelden — dan is dit een kolom met een smalle rail
         bovenaan, het paneel eronder over de volle breedte, en het veld
         daar weer onder. Precies wat er misging. */
      .bord-werkvlak { display:flex; flex-direction:row; align-items:stretch; gap:11px; }
      /* width en niet alleen flex-basis: het bord staat ook in een
         venster waar de ouder géén flexrij is (de tekening bij een
         oefening, en de tactiek bij een wedstrijd). Daar deed flex:0 0
         56px niets en werd elke knop zo breed als het venster — een
         lijst van elf balken over de volle breedte in plaats van een
         kolom. Met een echte breedte kan dat niet meer gebeuren. */
      .bord-rail { width:56px; flex:0 0 56px; display:flex; flex-direction:column;
        flex-wrap:nowrap; gap:5px; align-content:start; }
      /* Alleen de knoppen ín de kolom worden zo breed als de kolom.
         Zonder dat > gold deze regel óók voor de knoppen in het paneel
         ernaast, en werd "Zet neer" een stapel balken over de volle
         breedte in plaats van vier vakjes naast elkaar. Datzelfde
         gebeurde bij het materiaal, de zones en de lijnen. */
      .bord-rail > .rail-knop { width:100%; height:36px; }
      .bord-rail > .rail-scheiding { width:100%; height:1px; align-self:auto; margin:2px 0; }
      .bord-zij { flex:0 0 190px; max-height:64vh; overflow-y:auto; padding-right:2px; }
      /* Staat de veldkeuze open, dan is de tweede kolom smal: er staan
         alleen plaatjes in, dus meer breedte is verspilde veldruimte. */
      .bord-zij.smal { flex:0 0 104px; }
      .bord-zij.smal .veld-raster { flex-direction:column; flex-wrap:nowrap; }
      .bord-zij.smal .veld-knop { width:100%; flex:0 0 auto; }
      .bord-zij.smal .bord-knoppen { grid-template-columns:1fr; }
      .bord-zij.smal .knop-woord { display:none; }
      .bord-veld { flex:1 1 auto; }
    }

    /* Volledig scherm */
    .bord-vol { position:fixed; inset:0; z-index:700; background:var(--grijs-licht); display:flex; flex-direction:column; animation:inFaden .18s ease; }
    .bordv-kop { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--wit); border-bottom:1px solid var(--grijs); }
    .bordv-titel { font-size:15px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--tekst); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bordv-mid { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:10px 12px 12px; }
    .bordv-rij { flex:1; min-height:0; display:flex; align-items:stretch; gap:12px; }
    .bordv-rij .bord-rail { flex:0 0 56px; }
    .bordv-rij .bord-zij  { flex:0 0 232px; }
    .bordv-rij .bord-zij.smal { flex:0 0 116px; }
    .bordv-rij .bord-veld { flex:1 1 auto; min-width:0; }
    /* In volledig scherm bepaalt de resthoogte het doek, niet de
       verhouding van het veld: zo staat de framesbalk altijd in beeld. */
    .bord-vol .bord-doek { flex:1; min-height:0; width:100%; aspect-ratio:auto; max-height:none; }
    .bord-vol .bord-zij { max-height:none; }
    .bord-vol .bord-doek .teken-veld { width:auto; height:auto; max-width:100%; max-height:100%; flex-shrink:0; }
    .bord-vol .bord-rail { width:56px; display:flex; flex-direction:column; flex-wrap:nowrap; gap:5px; overflow-y:auto; }
    .bord-vol .bord-rail > .rail-knop { width:100%; height:36px; }
    .bord-vol .bord-rail > .rail-scheiding { width:100%; height:1px; margin:2px 0; }
    .bord-vol .bord-zij { max-height:none; overflow-y:auto; }
    .bord-vol .bord-frames { flex-shrink:0; }
    html[data-thema="donker"] .bord-vak { background:#15171e; }
    html[data-thema="donker"] .bordv-kop { background:#15171e; }

    /* ── DEELVENSTER (WhatsApp-voorbeeld) ── */
    .deel-bubbel { background:var(--wa-bubbel); border-radius:14px; border-top-right-radius:4px; padding:12px 14px 8px; margin-left:auto; max-width:420px; box-shadow:0 1px 2px rgba(0,0,0,.15); position:relative; }
    .deel-doek { background:var(--wa-doek); border-radius:14px; padding:16px 14px; max-height:46vh; overflow-y:auto; }
    .deel-tekst { font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; font-size:14px; line-height:1.45; color:var(--wa-tekst); white-space:pre-wrap; word-break:break-word; }
    .deel-tijd { text-align:right; font-size:10px; color:var(--wa-tijd); margin-top:3px; }
    .deel-keuze { display:flex; gap:6px; margin-bottom:12px; background:var(--grijs-licht); border-radius:10px; padding:3px; }
    .deel-keuze button { flex:1; border:none; background:none; padding:7px 6px; border-radius:8px; font-size:12px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--grijs-donker); cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; }
    .deel-keuze button.actief { background:var(--wit); color:var(--blauw); box-shadow:0 1px 3px rgba(0,0,0,.12); }
    .deel-rij { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .deel-rij .knop { justify-content:center; }
    .deel-kopregel { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--grijs-donker); font-family:'Helvetica Neue',Arial,sans-serif; }
    .deel-schakelknop { border:1px solid var(--grijs); background:var(--wit); color:var(--blauw); border-radius:20px; padding:5px 11px; font-size:11px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
    .deel-schakelknop:hover { border-color:var(--blauw); }
    .deel-opmaakbalk { display:flex; gap:5px; align-items:center; margin-bottom:7px; flex-wrap:wrap; }
    .deel-opmaakbalk button { min-width:32px; height:30px; border:1px solid var(--grijs); background:var(--wit); color:var(--tekst); border-radius:8px; font-size:13px; cursor:pointer; font-family:'Helvetica Neue',Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
    .deel-opmaakbalk button:hover { border-color:var(--blauw); color:var(--blauw); }
    .deel-invoer { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:12.5px; line-height:1.6; resize:vertical; min-height:200px; white-space:pre-wrap; overflow-wrap:break-word; }
    .deel-tip { font-size:11px; color:var(--grijs-donker); line-height:1.6; margin-top:7px; }
    .deel-tip code { background:var(--grijs-licht); border:1px solid var(--grijs); border-radius:4px; padding:1px 5px; font-size:10.5px; font-family:ui-monospace,Menlo,Consolas,monospace; }
    .deel-regelbalk { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:12px 0 2px; }
    .deel-teller { font-size:11px; color:var(--grijs-donker); margin-right:auto; }
    .deel-schakel { display:flex; align-items:center; gap:9px; cursor:pointer; font-size:12px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--grijs-donker); }

    .inhoud { padding:var(--rand-marge); padding-bottom:calc(var(--nav-hoogte) + 16px); max-width:var(--app-breedte); margin:0 auto; animation:inFaden .2s ease; }
    /* ══════════════════════════════════════════════════════
       ZIJMENU — vanaf tablet (740px) links, daaronder onderin
    ══════════════════════════════════════════════════════ */
    .zijbalk { display:none; }

    /* Smaller tablet? Dan een slanker menu zodat de pagina ruimte houdt */
    @media (min-width:740px) and (max-width:1023px) { :root { --zijbalk:198px; } }

    @media (min-width:740px) {
      .zijbalk {
        display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0;
        width:var(--zijbalk); z-index:210;
        background:linear-gradient(165deg,#062f6e,var(--blauw));
        color:var(--op-kleur); box-shadow:2px 0 14px rgba(0,0,0,.18);
      }
      .zijbalk-merk { display:flex; align-items:center; gap:11px; padding:18px 16px 16px; border-bottom:1px solid rgba(255,255,255,.14); flex-shrink:0; }
      .zijbalk-merk h1 { font-size:16px; font-weight:700; line-height:1.15; letter-spacing:-.02em; }
      .zijbalk-merk .header-subtitel { font-size:9.5px; opacity:.72; }
      .zijbalk-nav { flex:1; overflow-y:auto; padding:12px 10px; display:flex; flex-direction:column; gap:3px; }
      .zijbalk-kop { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:1.1px; opacity:.55; padding:14px 10px 6px; font-family:'Helvetica Neue',Arial,sans-serif; }
      .zij-item {
        display:flex; align-items:center; gap:12px; width:100%;
        border:none; background:none; color:inherit; cursor:pointer;
        padding:10px 12px; border-radius:10px; text-align:left;
        font-size:13.5px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif;
        position:relative; transition:background .15s; -webkit-tap-highlight-color:transparent;
      }
      .zij-item:hover { background:rgba(255,255,255,.10); }
      .zij-item.actief { background:rgba(255,255,255,.18); }
      .zij-item.actief::before { content:""; position:absolute; left:-10px; top:9px; bottom:9px; width:4px; border-radius:0 3px 3px 0; background:var(--blauw-licht); }
      .zij-icoon { width:20px; text-align:center; font-size:15px; flex-shrink:0; opacity:.9; }
      /* Het slotje hangt rechts in de knop, niet tegen het label aan:
         zo staan ze bij vijf menu-items onder elkaar op één lijn in
         plaats van te dansen op de lengte van het woord ervoor. */
      .zij-item .slotje { margin-left:auto; }
      .zij-item.actief .zij-icoon { opacity:1; }
      .zijbalk-voet { padding:10px; border-top:1px solid rgba(255,255,255,.14); flex-shrink:0; }
      .zij-ontwerp { padding:9px 12px 3px; line-height:1.35; }
      .zij-ontwerp-studio { display:block; font-size:9.5px; font-weight:800; letter-spacing:1.2px;
        text-transform:uppercase; opacity:.62; font-family:'Helvetica Neue',Arial,sans-serif; }
      .zij-ontwerp-naam { display:block; font-size:10px; opacity:.42; margin-top:1px;
        font-family:'Helvetica Neue',Arial,sans-serif; }

      .app-schil { padding-left:var(--zijbalk); }
      .header { display:none; }
      .bottom-nav { display:none; }
      .inhoud { padding-bottom:36px; }
      /* Vensters en meldingen binnen het inhoudsgebied houden */
      .modal-overlay, .formatie-overlay, .bevestig-overlay { left:var(--zijbalk); }
      .toast-houder { left:var(--zijbalk); bottom:22px; }

      /* ── Vensters horen midden op het scherm ──
         Ze waren gebouwd als bodemblad: onderaan vastgeplakt, met ronde
         hoeken alleen bovenaan. Op een telefoon is dat precies goed —
         daar komt je duim vandaan.

         Op een laptop is het verkeerd. Een blad van 78% hoog dat aan de
         onderkant hangt, begint halverwege het scherm en loopt eronder
         weg: je kijkt naar een titel op tweederde hoogte en de knoppen
         die je nodig hebt zie je niet. De bovenste helft van het scherm
         staat ondertussen leeg.

         Vanaf de breedte waarop de zijbalk verschijnt is het dus geen
         blad meer maar een venster: gecentreerd, rondom afgerond, en
         hoog genoeg om in één keer te lezen. */
      .modal-overlay, .formatie-overlay {
        align-items:center; padding:24px;
      }
      .modal-sheet, .formatie-sheet {
        border-radius:18px; max-height:calc(100vh - 48px);
        box-shadow:0 18px 50px rgba(0,0,0,.28);
        animation:inFaden .15s ease;
      }
      .modal-sheet { padding:18px 20px 24px; }
      .formatie-sheet { padding:18px 20px 22px; }
      /* De greep is het handvat van een blad dat je omhoog trekt. Een
         venster trek je nergens heen. */
      .modal-greep { display:none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script>
/* Geen laadscherm: als alles werkt zie je de app meteen. Gaat er iets
   mis bij het compileren of laden, dan zou je anders naar een leeg
   scherm kijken — dit vangt dat op en zegt wat er aan de hand is. */
window.addEventListener("error", function(e){
  if (document.querySelector("#root > *")) return;      /* app draait al */
  var doel = document.getElementById("root");
  if (!doel || doel.dataset.foutGemeld) return;
  doel.dataset.foutGemeld = "1";
  doel.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;' +
    'font-family:\'Helvetica Neue\',Arial,sans-serif;background:#f6f7f9;color:#191e26;">' +
    '<div style="max-width:460px;text-align:center;">' +
    '<div style="font-size:34px;margin-bottom:10px;">\u26A0\uFE0F</div>' +
    '<div style="font-size:17px;font-weight:800;">De app kon niet starten</div>' +
    '<div style="font-size:13px;color:#6c757d;margin-top:8px;line-height:1.6;">' +
    'Ververs de pagina. Blijft dit staan, dan is er iets stuk in het bestand.</div>' +
    '<div style="font-size:11px;color:#9aa1aa;margin-top:14px;font-family:monospace;' +
    'word-break:break-word;">' + String((e && e.message) || "onbekende fout") + '</div>' +
    '</div></div>';

  /* Deze fout ook naar public.foutmeldingen sturen (server/16-foutrapportage.sql),
     als stuurFoutmelding() al bestaat. Die functie staat in
     src/kern/foutmeldingen.js, dat pas verderop in het tweede
     <script>-blok hieronder wordt geladen — bij de klassieke reden dat
     déze handler bestaat (een syntaxfout die het HELE gebouwde bestand
     laat mislukken) is dat blok nooit tot uitvoering gekomen, en dus
     bestaat de functie dan nog niet. In dat geval blijft het bij de
     melding hierboven: die is voor de gebruiker al zichtbaar, en
     tools/check.py vangt zo'n syntaxfout bovendien al vóór het
     uitrollen. Vandaar de typeof-check in plaats van er blindelings
     van uit te gaan dat de functie er al is. */
  try {
    if (typeof stuurFoutmelding === "function") {
      stuurFoutmelding({
        bericht: String((e && e.message) || "onbekende fout"),
        stack: (e && e.error && e.error.stack) ? String(e.error.stack) : undefined,
        scherm: "onbekend",      /* de app is nog niet eens gestart, er is nog geen scherm gekozen */
        fouttype: "opstartfout"
      });
    }
  } catch (foutBijMelden) { /* nooit een tweede fout bovenop de eerste */ }
});
</script>
<script>
/* @BOUW:APP@ */
</script>
</body>
